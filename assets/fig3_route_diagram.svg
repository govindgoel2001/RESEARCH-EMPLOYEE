<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Georgia, serif">
  <rect width="800" height="380" fill="#f9f4ed"/>

  <!-- Title -->
  <text x="400" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 3 — HOW TO REACH BILASGARH</text>
  <text x="400" y="50" font-size="11" font-style="italic" text-anchor="middle" fill="#666">Route schematic from major cities to the ruins</text>

  <!-- Horizontal route line -->
  <line x1="80" y1="180" x2="720" y2="180" stroke="#3a2a20" stroke-width="2"/>

  <!-- Stop circles -->
  <g>
    <!-- Delhi -->
    <circle cx="80" cy="180" r="22" fill="#fff" stroke="#3a2a20" stroke-width="2"/>
    <text x="80" y="184" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">DEL</text>
    <text x="80" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Delhi</text>
    <text x="80" y="148" font-size="8" text-anchor="middle" fill="#666">(international hub)</text>

    <!-- Jaipur -->
    <circle cx="220" cy="180" r="22" fill="#fff" stroke="#3a2a20" stroke-width="2"/>
    <text x="220" y="184" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">JAI</text>
    <text x="220" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Jaipur</text>
    <text x="220" y="148" font-size="8" text-anchor="middle" fill="#666">(nearest airport)</text>

    <!-- Kota -->
    <circle cx="360" cy="180" r="22" fill="#fff" stroke="#3a2a20" stroke-width="2"/>
    <text x="360" y="184" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">KOTA</text>
    <text x="360" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Kota</text>
    <text x="360" y="148" font-size="8" text-anchor="middle" fill="#666">(major railhead)</text>

    <!-- Baran -->
    <circle cx="500" cy="180" r="22" fill="#fff" stroke="#3a2a20" stroke-width="2"/>
    <text x="500" y="184" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">BAR</text>
    <text x="500" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Baran</text>
    <text x="500" y="148" font-size="8" text-anchor="middle" fill="#666">(district HQ, hotels)</text>

    <!-- Kishanganj -->
    <circle cx="620" cy="180" r="18" fill="#fff" stroke="#3a2a20" stroke-width="2"/>
    <text x="620" y="184" font-size="9" font-weight="bold" text-anchor="middle" fill="#1a1a1a">KSH</text>
    <text x="620" y="135" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Kishanganj</text>
    <text x="620" y="148" font-size="8" text-anchor="middle" fill="#666">(tehsil town)</text>

    <!-- BILASGARH -->
    <g transform="translate(720, 180)">
      <circle cx="0" cy="0" r="28" fill="#8B0000" stroke="#3a2a20" stroke-width="2.5"/>
      <polygon points="0,-15 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4"
               fill="#ffd700" stroke="#fff" stroke-width="1"/>
    </g>
    <text x="720" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#8B0000">BILASGARH</text>
    <text x="720" y="148" font-size="8" font-style="italic" text-anchor="middle" fill="#5a2020">the ruins</text>
  </g>

  <!-- Distance / time labels below -->
  <g font-size="9" fill="#3a2a20">
    <text x="150" y="225" text-anchor="middle">~260 km</text>
    <text x="150" y="237" text-anchor="middle" font-style="italic" fill="#666">train/road · 4–5 hrs</text>

    <text x="290" y="225" text-anchor="middle">~245 km</text>
    <text x="290" y="237" text-anchor="middle" font-style="italic" fill="#666">train · 3.5 hrs</text>

    <text x="430" y="225" text-anchor="middle">~75 km</text>
    <text x="430" y="237" text-anchor="middle" font-style="italic" fill="#666">train · 1.5 hrs</text>

    <text x="560" y="225" text-anchor="middle">~18 km</text>
    <text x="560" y="237" text-anchor="middle" font-style="italic" fill="#666">road · 30 min</text>

    <text x="670" y="225" text-anchor="middle">~25 km</text>
    <text x="670" y="237" text-anchor="middle" font-style="italic" fill="#666">jeep · 45 min</text>
  </g>

  <!-- Mode icons above -->
  <g font-size="14">
    <text x="150" y="105" text-anchor="middle">RAIL</text>
    <text x="290" y="105" text-anchor="middle">RAIL</text>
    <text x="430" y="105" text-anchor="middle">RAIL</text>
    <text x="560" y="105" text-anchor="middle">ROAD</text>
    <text x="670" y="105" text-anchor="middle">JEEP</text>

    <text x="150" y="90" text-anchor="middle" font-size="8" fill="#666">— mode —</text>
    <text x="290" y="90" text-anchor="middle" font-size="8" fill="#666">— mode —</text>
    <text x="430" y="90" text-anchor="middle" font-size="8" fill="#666">— mode —</text>
    <text x="560" y="90" text-anchor="middle" font-size="8" fill="#666">— mode —</text>
    <text x="670" y="90" text-anchor="middle" font-size="8" fill="#666">— mode —</text>
  </g>

  <!-- Bottom summary box -->
  <g transform="translate(80, 280)">
    <rect x="0" y="0" width="640" height="75" fill="#fff" stroke="#3a2a20" stroke-width="1.2"/>
    <text x="320" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">TOTAL JOURNEY FROM DELHI</text>
    <text x="160" y="42" font-size="10" text-anchor="middle" fill="#1a1a1a">~ <tspan font-weight="bold">600 km</tspan></text>
    <text x="160" y="58" font-size="9" font-style="italic" text-anchor="middle" fill="#666">total distance</text>

    <text x="320" y="42" font-size="10" text-anchor="middle" fill="#1a1a1a">~ <tspan font-weight="bold">11–13 hours</tspan></text>
    <text x="320" y="58" font-size="9" font-style="italic" text-anchor="middle" fill="#666">total travel time</text>

    <text x="490" y="42" font-size="10" text-anchor="middle" fill="#1a1a1a"><tspan font-weight="bold">Oct – Mar</tspan></text>
    <text x="490" y="58" font-size="9" font-style="italic" text-anchor="middle" fill="#666">best season</text>
  </g>

  <text x="400" y="370" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Recommended: fly to Jaipur → train to Kota → train/road to Baran → hire jeep
  </text>
</svg>
