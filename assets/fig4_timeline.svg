<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#f9f4ed"/>

  <!-- Title -->
  <text x="400" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 4 — HISTORICAL TIMELINE OF BILASGARH</text>
  <text x="400" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#666">~2,300 years of habitation, prosperity, destruction, and silence</text>

  <!-- Central timeline line -->
  <line x1="100" y1="250" x2="720" y2="250" stroke="#3a2a20" stroke-width="3"/>

  <!-- Arrow at end -->
  <polygon points="720,250 710,244 710,256" fill="#3a2a20"/>

  <!-- Era bands (background colored bands above the line) -->
  <g opacity="0.5">
    <rect x="100" y="190" width="120" height="50" fill="#d4a574"/>
    <rect x="220" y="190" width="120" height="50" fill="#c4a07a"/>
    <rect x="340" y="190" width="280" height="50" fill="#a8835a"/>
    <rect x="620" y="190" width="60" height="50" fill="#8B0000"/>
    <rect x="680" y="190" width="40" height="50" fill="#666"/>
  </g>

  <!-- Era labels -->
  <text x="160" y="220" font-size="9" font-weight="bold" text-anchor="middle" fill="#1a1a1a">MALAVA</text>
  <text x="160" y="232" font-size="8" text-anchor="middle" fill="#1a1a1a">REPUBLIC</text>

  <text x="280" y="220" font-size="9" font-weight="bold" text-anchor="middle" fill="#1a1a1a">PARAMARA /</text>
  <text x="280" y="232" font-size="8" text-anchor="middle" fill="#1a1a1a">EARLY MEDIEVAL</text>

  <text x="480" y="220" font-size="9" font-weight="bold" text-anchor="middle" fill="#1a1a1a">KHICHI CHAUHAN ERA</text>
  <text x="480" y="232" font-size="8" font-style="italic" text-anchor="middle" fill="#1a1a1a">city flourishes — temples, schools, prosperity</text>

  <text x="650" y="220" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">DESTRUCTION</text>
  <text x="650" y="232" font-size="8" text-anchor="middle" fill="#fff">(Aurangzeb)</text>

  <text x="700" y="220" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">RUINS</text>

  <!-- Year markers and events -->
  <g>
    <!-- 250 BCE -->
    <circle cx="120" cy="250" r="6" fill="#ffd700" stroke="#3a2a20" stroke-width="1.5"/>
    <line x1="120" y1="250" x2="120" y2="305" stroke="#3a2a20" stroke-width="1"/>
    <text x="120" y="320" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">~250 BCE</text>
    <text x="120" y="335" font-size="9" text-anchor="middle" fill="#3a2a20">Malava coins</text>
    <text x="120" y="347" font-size="9" text-anchor="middle" fill="#3a2a20">in circulation</text>

    <!-- 200 CE -->
    <circle cx="220" cy="250" r="5" fill="#fff" stroke="#3a2a20" stroke-width="1.5"/>
    <line x1="220" y1="250" x2="220" y2="180" stroke="#3a2a20" stroke-width="1"/>
    <text x="220" y="172" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">~200 CE</text>
    <text x="220" y="158" font-size="9" text-anchor="middle" fill="#3a2a20">End of Malava</text>
    <text x="220" y="146" font-size="9" text-anchor="middle" fill="#3a2a20">republican coinage</text>

    <!-- 9th c. -->
    <circle cx="380" cy="250" r="6" fill="#ffd700" stroke="#3a2a20" stroke-width="1.5"/>
    <line x1="380" y1="250" x2="380" y2="305" stroke="#3a2a20" stroke-width="1"/>
    <text x="380" y="320" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">~9th c. CE</text>
    <text x="380" y="335" font-size="9" text-anchor="middle" fill="#3a2a20">Vishnu temple</text>
    <text x="380" y="347" font-size="9" text-anchor="middle" fill="#3a2a20">construction begins</text>

    <!-- 10th c. raids -->
    <circle cx="460" cy="250" r="5" fill="#fff" stroke="#3a2a20" stroke-width="1.5"/>
    <line x1="460" y1="250" x2="460" y2="180" stroke="#3a2a20" stroke-width="1"/>
    <text x="460" y="172" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">~10th c. CE</text>
    <text x="460" y="158" font-size="9" text-anchor="middle" fill="#3a2a20">Repeated raids</text>
    <text x="460" y="146" font-size="9" text-anchor="middle" fill="#3a2a20">from the northwest</text>

    <!-- 12th c. temple complete -->
    <circle cx="540" cy="250" r="5" fill="#ffd700" stroke="#3a2a20" stroke-width="1.5"/>
    <line x1="540" y1="250" x2="540" y2="305" stroke="#3a2a20" stroke-width="1"/>
    <text x="540" y="320" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">~12th c. CE</text>
    <text x="540" y="335" font-size="9" text-anchor="middle" fill="#3a2a20">Temple complex</text>
    <text x="540" y="347" font-size="9" text-anchor="middle" fill="#3a2a20">at full extent</text>

    <!-- 1658 Aurangzeb -->
    <circle cx="640" cy="250" r="8" fill="#8B0000" stroke="#3a2a20" stroke-width="2"/>
    <line x1="640" y1="250" x2="640" y2="180" stroke="#8B0000" stroke-width="2"/>
    <text x="640" y="172" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">1658–1707 CE</text>
    <text x="640" y="158" font-size="9" font-weight="bold" text-anchor="middle" fill="#8B0000">AURANGZEB'S REIGN</text>
    <text x="640" y="146" font-size="9" text-anchor="middle" fill="#8B0000">City destroyed</text>
    <text x="640" y="134" font-size="9" text-anchor="middle" fill="#8B0000">~15,000 sculptures shattered</text>

    <!-- 2020 -->
    <circle cx="700" cy="250" r="5" fill="#ffd700" stroke="#3a2a20" stroke-width="1.5"/>
    <line x1="700" y1="250" x2="700" y2="305" stroke="#3a2a20" stroke-width="1"/>
    <text x="700" y="320" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2020 CE</text>
    <text x="700" y="335" font-size="9" text-anchor="middle" fill="#3a2a20">Govt. Museum,</text>
    <text x="700" y="347" font-size="9" text-anchor="middle" fill="#3a2a20">Baran opens</text>
  </g>

  <!-- Bottom commentary box -->
  <g transform="translate(80, 395)">
    <rect x="0" y="0" width="640" height="80" fill="#fff" stroke="#3a2a20" stroke-width="1"/>
    <text x="320" y="20" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">THE BREAK POINT</text>
    <text x="320" y="40" font-size="10" text-anchor="middle" fill="#1a1a1a">
      For over 1,800 years, this city was continuously inhabited as a settlement of regional importance.
    </text>
    <text x="320" y="56" font-size="10" text-anchor="middle" fill="#1a1a1a">
      One imperial order ended that. After ~1700 CE, it was never lived in again.
    </text>
    <text x="320" y="72" font-size="9" font-style="italic" text-anchor="middle" fill="#666">
      → A continuous civilization erased in a single generation
    </text>
  </g>

  <text x="400" y="490" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Periods are approximate; exact destruction year within Aurangzeb's reign (1658–1707) is undocumented
  </text>
</svg>
