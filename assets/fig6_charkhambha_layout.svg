<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Georgia, serif">
  <rect width="800" height="560" fill="#f9f4ed"/>

  <text x="400" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 6 — THE CHARKHAMBHA (FOUR PILLARS)</text>
  <text x="400" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#666">Schematic of the surviving structure of the main Vishnu temple's mandapa</text>

  <!-- LEFT: Top-down plan -->
  <g transform="translate(80, 95)">
    <text x="135" y="-8" font-size="13" font-weight="bold" text-anchor="middle" fill="#8B0000">TOP-DOWN PLAN</text>

    <!-- Platform (jagati) outline -->
    <rect x="0" y="0" width="270" height="270" fill="#e8d5b7" stroke="#3a2a20" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="135" y="14" font-size="9" font-style="italic" text-anchor="middle" fill="#5a3a2a">temple platform (jagati) — ruined edges</text>

    <!-- The 4 pillars (square arrangement) -->
    <g>
      <!-- NW -->
      <circle cx="85" cy="85" r="18" fill="#c97a5a" stroke="#3a2a20" stroke-width="2"/>
      <circle cx="85" cy="85" r="10" fill="#8b5a3a"/>
      <!-- NE -->
      <circle cx="185" cy="85" r="18" fill="#c97a5a" stroke="#3a2a20" stroke-width="2"/>
      <circle cx="185" cy="85" r="10" fill="#8b5a3a"/>
      <!-- SW -->
      <circle cx="85" cy="185" r="18" fill="#c97a5a" stroke="#3a2a20" stroke-width="2"/>
      <circle cx="85" cy="185" r="10" fill="#8b5a3a"/>
      <!-- SE -->
      <circle cx="185" cy="185" r="18" fill="#c97a5a" stroke="#3a2a20" stroke-width="2"/>
      <circle cx="185" cy="185" r="10" fill="#8b5a3a"/>
    </g>

    <!-- Lines connecting pillars (showing the square mandapa) -->
    <g stroke="#3a2a20" stroke-width="1" stroke-dasharray="2,2" fill="none">
      <line x1="85" y1="85" x2="185" y2="85"/>
      <line x1="185" y1="85" x2="185" y2="185"/>
      <line x1="185" y1="185" x2="85" y2="185"/>
      <line x1="85" y1="185" x2="85" y2="85"/>
    </g>

    <!-- Central space label -->
    <text x="135" y="135" font-size="11" font-style="italic" text-anchor="middle" fill="#3a2a20">central</text>
    <text x="135" y="148" font-size="11" font-style="italic" text-anchor="middle" fill="#3a2a20">open space</text>

    <!-- Direction to sanctum (presumed) -->
    <line x1="135" y1="190" x2="135" y2="240" stroke="#8B0000" stroke-width="1.5" stroke-dasharray="4,2"/>
    <polygon points="135,248 130,238 140,238" fill="#8B0000"/>
    <text x="135" y="262" font-size="9" font-style="italic" text-anchor="middle" fill="#8B0000">(towards destroyed sanctum)</text>

    <!-- Compass -->
    <g transform="translate(245, 250)">
      <circle cx="0" cy="0" r="14" fill="#fff" stroke="#3a2a20" stroke-width="1"/>
      <polygon points="0,-10 3,0 0,10 -3,0" fill="#8B0000"/>
      <text x="0" y="-18" font-size="9" font-weight="bold" text-anchor="middle" fill="#3a2a20">N</text>
    </g>

    <!-- Label arrows -->
    <line x1="85" y1="85" x2="40" y2="60" stroke="#3a2a20" stroke-width="0.8"/>
    <text x="35" y="55" font-size="9" text-anchor="end" fill="#3a2a20">Pillar 1</text>

    <line x1="185" y1="85" x2="245" y2="60" stroke="#3a2a20" stroke-width="0.8"/>
    <text x="250" y="55" font-size="9" fill="#3a2a20">Pillar 2</text>

    <line x1="85" y1="185" x2="40" y2="215" stroke="#3a2a20" stroke-width="0.8"/>
    <text x="35" y="220" font-size="9" text-anchor="end" fill="#3a2a20">Pillar 4</text>

    <line x1="185" y1="185" x2="245" y2="215" stroke="#3a2a20" stroke-width="0.8"/>
    <text x="250" y="220" font-size="9" fill="#3a2a20">Pillar 3</text>
  </g>

  <!-- RIGHT: Elevation of a single pillar -->
  <g transform="translate(470, 95)">
    <text x="120" y="-8" font-size="13" font-weight="bold" text-anchor="middle" fill="#8B0000">PILLAR ELEVATION (one of four)</text>

    <!-- Capital (top decorated block) -->
    <rect x="80" y="30" width="80" height="20" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>
    <rect x="70" y="50" width="100" height="14" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>
    <text x="200" y="44" font-size="9" fill="#3a2a20">← capital</text>

    <!-- Decorated top frieze -->
    <rect x="90" y="64" width="60" height="22" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>
    <g stroke="#3a2a20" stroke-width="0.7" fill="none">
      <circle cx="105" cy="75" r="3"/>
      <circle cx="120" cy="75" r="3"/>
      <circle cx="135" cy="75" r="3"/>
    </g>
    <text x="200" y="78" font-size="9" fill="#3a2a20">← niches with deities</text>

    <!-- Main shaft (with decorative bands) -->
    <rect x="95" y="86" width="50" height="200" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>

    <!-- Decorative bands -->
    <g stroke="#3a2a20" stroke-width="0.6" fill="none">
      <line x1="95" y1="105" x2="145" y2="105"/>
      <line x1="95" y1="125" x2="145" y2="125"/>
      <line x1="95" y1="180" x2="145" y2="180"/>
      <line x1="95" y1="250" x2="145" y2="250"/>
      <line x1="95" y1="270" x2="145" y2="270"/>
    </g>

    <!-- Carved patterns (zig-zag/floral) -->
    <g fill="#8b5a3a">
      <polygon points="100,140 110,148 120,140 110,132"/>
      <polygon points="120,140 130,148 140,140 130,132"/>
      <polygon points="100,160 110,168 120,160 110,152"/>
      <polygon points="120,160 130,168 140,160 130,152"/>

      <polygon points="100,200 110,208 120,200 110,192"/>
      <polygon points="120,200 130,208 140,200 130,192"/>
      <polygon points="100,220 110,228 120,220 110,212"/>
      <polygon points="120,220 130,228 140,220 130,212"/>
    </g>
    <text x="200" y="180" font-size="9" fill="#3a2a20">← elephants, nagas,</text>
    <text x="200" y="192" font-size="9" fill="#3a2a20">    dancers, florals</text>

    <!-- Base -->
    <rect x="80" y="286" width="80" height="14" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>
    <rect x="70" y="300" width="100" height="20" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>
    <text x="200" y="316" font-size="9" fill="#3a2a20">← base</text>

    <!-- Ground line -->
    <line x1="40" y1="320" x2="240" y2="320" stroke="#3a2a20" stroke-width="2"/>

    <!-- Height -->
    <line x1="50" y1="30" x2="50" y2="320" stroke="#666" stroke-width="0.8"/>
    <line x1="46" y1="30" x2="54" y2="30" stroke="#666" stroke-width="0.8"/>
    <line x1="46" y1="320" x2="54" y2="320" stroke="#666" stroke-width="0.8"/>
    <text x="42" y="180" font-size="9" text-anchor="end" fill="#666" transform="rotate(-90 42 180)">red sandstone shaft</text>
  </g>

  <!-- Bottom info box -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="640" height="105" fill="#fff" stroke="#3a2a20" stroke-width="1"/>
    <text x="320" y="20" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">WHAT THE FOUR PILLARS WERE</text>
    <text x="20" y="42" font-size="10" fill="#1a1a1a">• Period: <tspan font-weight="bold">late 9th – early 12th century CE</tspan> · Material: <tspan font-weight="bold">red sandstone</tspan></text>
    <text x="20" y="58" font-size="10" fill="#1a1a1a">• Function: pillars of the <tspan font-weight="bold">mandapa</tspan> (assembly/entrance hall) of a large Vishnu temple</text>
    <text x="20" y="74" font-size="10" fill="#1a1a1a">• Style: <tspan font-weight="bold">Nagara (North Indian)</tspan> — the same architectural tradition as Khajuraho</text>
    <text x="20" y="90" font-size="10" fill="#1a1a1a">• Today: <tspan font-weight="bold">only these four pillars remain standing</tspan>; the temple sanctum and city are rubble</text>
  </g>

  <text x="400" y="548" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Schematic reconstruction based on architectural documentation (sahasa.in, 2023); not an excavation drawing
  </text>
</svg>
