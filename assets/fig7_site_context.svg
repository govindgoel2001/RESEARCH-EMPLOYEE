<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Georgia, serif">
  <rect width="800" height="540" fill="#f9f4ed"/>

  <text x="400" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 7 — SITE CONTEXT: THE RUINS &amp; KANYA DAH</text>
  <text x="400" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#666">Stylized aerial view — forest, river bend, and what remains of the city</text>

  <!-- Background: forest base -->
  <rect x="60" y="80" width="680" height="380" fill="#d8d2bc"/>

  <!-- Forest texture (many tiny tree circles) -->
  <g fill="#5d7d4b" opacity="0.35">
    <!-- left forest -->
    <circle cx="90" cy="100" r="8"/><circle cx="110" cy="115" r="7"/><circle cx="130" cy="100" r="6"/>
    <circle cx="100" cy="130" r="7"/><circle cx="80" cy="145" r="8"/><circle cx="120" cy="150" r="7"/>
    <circle cx="140" cy="135" r="6"/><circle cx="95" cy="170" r="7"/><circle cx="115" cy="190" r="6"/>
    <circle cx="85" cy="200" r="7"/><circle cx="135" cy="180" r="6"/><circle cx="100" cy="225" r="8"/>
    <circle cx="85" cy="250" r="7"/><circle cx="125" cy="245" r="6"/><circle cx="105" cy="270" r="7"/>
    <circle cx="135" cy="290" r="6"/><circle cx="115" cy="310" r="7"/><circle cx="95" cy="330" r="8"/>
    <circle cx="135" cy="345" r="6"/><circle cx="115" cy="365" r="7"/><circle cx="80" cy="370" r="8"/>
    <circle cx="100" cy="400" r="7"/><circle cx="130" cy="420" r="6"/><circle cx="90" cy="435" r="8"/>

    <!-- top forest -->
    <circle cx="180" cy="100" r="6"/><circle cx="220" cy="105" r="7"/><circle cx="260" cy="100" r="6"/>
    <circle cx="300" cy="110" r="7"/><circle cx="340" cy="105" r="6"/><circle cx="380" cy="100" r="8"/>
    <circle cx="420" cy="115" r="7"/><circle cx="460" cy="100" r="6"/><circle cx="500" cy="110" r="7"/>
    <circle cx="540" cy="100" r="6"/><circle cx="580" cy="115" r="7"/><circle cx="620" cy="100" r="8"/>
    <circle cx="660" cy="110" r="6"/><circle cx="700" cy="105" r="7"/>

    <circle cx="200" cy="130" r="6"/><circle cx="250" cy="140" r="7"/><circle cx="320" cy="130" r="6"/>
    <circle cx="450" cy="135" r="6"/><circle cx="550" cy="140" r="7"/><circle cx="680" cy="130" r="6"/>

    <!-- right forest -->
    <circle cx="700" cy="160" r="7"/><circle cx="720" cy="180" r="6"/><circle cx="685" cy="200" r="7"/>
    <circle cx="715" cy="220" r="8"/><circle cx="695" cy="245" r="6"/><circle cx="720" cy="265" r="7"/>
    <circle cx="690" cy="290" r="8"/><circle cx="715" cy="310" r="7"/><circle cx="685" cy="330" r="6"/>
    <circle cx="720" cy="350" r="7"/><circle cx="690" cy="380" r="8"/><circle cx="715" cy="410" r="6"/>
    <circle cx="685" cy="430" r="7"/>

    <!-- bottom forest -->
    <circle cx="180" cy="440" r="7"/><circle cx="230" cy="445" r="6"/><circle cx="280" cy="440" r="7"/>
    <circle cx="320" cy="448" r="6"/><circle cx="380" cy="442" r="8"/><circle cx="450" cy="440" r="7"/>
    <circle cx="520" cy="445" r="6"/><circle cx="580" cy="440" r="8"/><circle cx="640" cy="445" r="7"/>
  </g>

  <!-- River (Bilas Nadi) curving through with a deep bend forming Kanya Dah -->
  <path d="M 60,250 Q 200,240 320,260 Q 380,275 420,310 Q 450,340 500,330 Q 580,315 660,290 Q 720,275 740,265"
        fill="none" stroke="#5b8db5" stroke-width="14" opacity="0.85"/>
  <path d="M 60,250 Q 200,240 320,260 Q 380,275 420,310 Q 450,340 500,330 Q 580,315 660,290 Q 720,275 740,265"
        fill="none" stroke="#4a7396" stroke-width="3" opacity="0.6"/>

  <text x="170" y="232" font-size="11" font-style="italic" fill="#345066" font-weight="bold">Bilas Nadi</text>
  <text x="170" y="245" font-size="9" font-style="italic" fill="#345066">(tributary of the Parbati)</text>

  <!-- Kanya Dah pool — the deep bend -->
  <ellipse cx="440" cy="328" rx="32" ry="18" fill="#2c4a66" opacity="0.92"/>
  <ellipse cx="440" cy="328" rx="32" ry="18" fill="none" stroke="#1a3550" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Lotus on the water (subtle symbol) -->
  <g transform="translate(440, 328)">
    <ellipse cx="0" cy="0" rx="6" ry="3" fill="#f5d9d9" opacity="0.9"/>
    <ellipse cx="-4" cy="-1" rx="2.5" ry="3.5" fill="#f5d9d9"/>
    <ellipse cx="4" cy="-1" rx="2.5" ry="3.5" fill="#f5d9d9"/>
    <ellipse cx="0" cy="-3" rx="2.5" ry="3.5" fill="#f5d9d9"/>
    <circle cx="0" cy="-1" r="1.2" fill="#b8860b"/>
  </g>

  <!-- Label with arrow -->
  <line x1="440" y1="312" x2="475" y2="275" stroke="#8B0000" stroke-width="1.2"/>
  <text x="478" y="270" font-size="13" font-weight="bold" fill="#8B0000">KANYA DAH</text>
  <text x="478" y="284" font-size="9" font-style="italic" fill="#5a2020">"the Pool of the Maiden"</text>

  <!-- Ruins cluster (downstream from Kanya Dah) -->
  <!-- The Charkhambha — 4 pillar dots -->
  <g transform="translate(290, 360)">
    <rect x="-30" y="-30" width="60" height="60" fill="#e8d5b7" stroke="#3a2a20" stroke-width="1.2" stroke-dasharray="3,2"/>
    <circle cx="-15" cy="-15" r="5" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>
    <circle cx="15" cy="-15" r="5" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>
    <circle cx="-15" cy="15" r="5" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="5" fill="#c97a5a" stroke="#3a2a20" stroke-width="1.2"/>
  </g>
  <line x1="290" y1="330" x2="265" y2="290" stroke="#3a2a20" stroke-width="1"/>
  <text x="260" y="285" font-size="12" font-weight="bold" text-anchor="end" fill="#3a2a20">CHARKHAMBHA</text>
  <text x="260" y="298" font-size="9" font-style="italic" text-anchor="end" fill="#3a2a20">(4 surviving pillars)</text>

  <!-- Rubble/scatter (the ruined city) -->
  <g fill="#8b6f4a" opacity="0.75">
    <polygon points="220,380 226,388 232,382 228,376"/>
    <polygon points="240,390 248,398 256,392 250,384"/>
    <polygon points="200,400 208,406 214,400 208,394"/>
    <polygon points="260,400 268,406 276,398 268,394"/>
    <polygon points="220,420 228,428 236,422 228,416"/>
    <polygon points="180,415 186,422 194,418 188,412"/>
    <polygon points="170,395 176,402 184,397 178,391"/>
    <polygon points="340,390 348,397 356,391 348,385"/>
    <polygon points="360,410 368,416 376,410 368,404"/>
    <polygon points="380,395 388,402 396,398 390,392"/>
    <polygon points="400,415 408,420 416,415 410,410"/>
  </g>

  <!-- Scatter label -->
  <line x1="200" y1="410" x2="160" y2="395" stroke="#3a2a20" stroke-width="0.8"/>
  <text x="155" y="392" font-size="9" font-style="italic" text-anchor="end" fill="#3a2a20">rubble &amp; broken</text>
  <text x="155" y="403" font-size="9" font-style="italic" text-anchor="end" fill="#3a2a20">sculpture fragments</text>

  <!-- Forest area label (top right) -->
  <text x="600" y="160" font-size="11" font-style="italic" fill="#3d5d2b" font-weight="bold">dense forest</text>
  <text x="600" y="174" font-size="9" font-style="italic" fill="#3d5d2b">(continuous on all sides)</text>

  <!-- Jeep track approaching from Kishanganj -->
  <path d="M 60,470 Q 130,460 200,455 Q 250,450 280,420"
        fill="none" stroke="#5a3a2a" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="60" y="488" font-size="9" font-style="italic" fill="#5a3a2a">→ from Kishanganj (kuccha jeep track)</text>

  <!-- Compass -->
  <g transform="translate(700, 100)">
    <circle cx="0" cy="0" r="18" fill="#fff" stroke="#3a2a20" stroke-width="1.2"/>
    <polygon points="0,-13 4,0 0,13 -4,0" fill="#8B0000"/>
    <text x="0" y="-22" font-size="10" text-anchor="middle" fill="#3a2a20" font-weight="bold">N</text>
  </g>

  <!-- Bottom annotation -->
  <g transform="translate(80, 480)">
    <text x="320" y="14" font-size="9" font-style="italic" text-anchor="middle" fill="#666">
      The site is a single landscape: river bends to form Kanya Dah, ruins lie at the edge of the forest near the river, no settlement around.
    </text>
    <text x="320" y="30" font-size="9" font-style="italic" text-anchor="middle" fill="#666">
      Walking distance from the pool to the Charkhambha pillars is short — you can see one from the other.
    </text>
  </g>

  <text x="400" y="528" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Stylized aerial schematic — relative positions inferred from descriptive sources; not surveyed
  </text>
</svg>
