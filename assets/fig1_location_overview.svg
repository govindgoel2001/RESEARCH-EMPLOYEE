<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="800" height="700" fill="#f9f4ed"/>

  <!-- Title -->
  <text x="400" y="38" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 1 — LOCATION OVERVIEW</text>
  <text x="400" y="58" font-size="11" font-style="italic" text-anchor="middle" fill="#666">Bilasgarh within India and Rajasthan</text>

  <!-- ============== INDIA OUTLINE (stylized) ============== -->
  <g transform="translate(50, 90)">
    <text x="160" y="-8" font-size="12" font-weight="bold" fill="#8B0000" text-anchor="middle">INDIA</text>
    <!-- Stylized India shape -->
    <path d="M 100,40 L 140,30 L 180,32 L 220,40 L 250,55 L 270,80 L 290,90 L 310,100
             L 305,140 L 285,180 L 260,220 L 240,250 L 220,290 L 200,330 L 180,360
             L 160,380 L 140,360 L 120,330 L 100,290 L 85,240 L 75,190 L 70,140
             L 75,90 L 90,55 Z"
          fill="#e8d5b7" stroke="#3a2a20" stroke-width="1.5"/>

    <!-- Rajasthan highlighted -->
    <path d="M 100,90 L 140,75 L 175,80 L 195,100 L 200,135 L 180,160 L 150,165 L 120,150 L 100,125 Z"
          fill="#8B0000" stroke="#3a2a20" stroke-width="1.5" opacity="0.85"/>

    <!-- Bilasgarh marker -->
    <circle cx="170" cy="125" r="5" fill="#ffd700" stroke="#3a2a20" stroke-width="1.5"/>
    <line x1="170" y1="125" x2="200" y2="105" stroke="#3a2a20" stroke-width="1"/>
    <text x="205" y="103" font-size="11" font-weight="bold" fill="#3a2a20">BILASGARH</text>

    <!-- Capital cities -->
    <circle cx="150" cy="95" r="3" fill="#3a2a20"/>
    <text x="155" y="92" font-size="9" fill="#3a2a20">Delhi</text>
    <circle cx="150" cy="120" r="3" fill="#3a2a20"/>
    <text x="155" y="118" font-size="9" fill="#3a2a20">Jaipur</text>
    <circle cx="190" cy="290" r="3" fill="#3a2a20"/>
    <text x="195" y="293" font-size="9" fill="#3a2a20">Chennai</text>
    <circle cx="120" cy="280" r="3" fill="#3a2a20"/>
    <text x="80" y="282" font-size="9" fill="#3a2a20">Mumbai</text>
    <circle cx="230" cy="230" r="3" fill="#3a2a20"/>
    <text x="235" y="232" font-size="9" fill="#3a2a20">Kolkata</text>

    <!-- Legend -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="14" height="12" fill="#8B0000" opacity="0.85"/>
      <text x="20" y="10" font-size="10" fill="#3a2a20">Rajasthan state</text>
      <circle cx="7" cy="32" r="5" fill="#ffd700" stroke="#3a2a20" stroke-width="1.5"/>
      <text x="20" y="35" font-size="10" fill="#3a2a20">Bilasgarh site</text>
    </g>
  </g>

  <!-- ============== RAJASTHAN DETAIL ============== -->
  <g transform="translate(420, 90)">
    <text x="160" y="-8" font-size="12" font-weight="bold" fill="#8B0000" text-anchor="middle">RAJASTHAN (zoom)</text>

    <!-- Rajasthan outline -->
    <path d="M 50,80 L 80,55 L 130,45 L 180,40 L 230,50 L 270,65 L 290,90
             L 295,140 L 280,180 L 260,220 L 230,260 L 195,290 L 160,300
             L 120,290 L 90,265 L 65,230 L 50,190 L 45,140 Z"
          fill="#f3e6cf" stroke="#3a2a20" stroke-width="1.5"/>

    <!-- Hadoti / Baran district -->
    <path d="M 215,200 L 250,195 L 270,215 L 265,245 L 240,260 L 215,255 L 200,235 Z"
          fill="#c97a5a" stroke="#3a2a20" stroke-width="1.5" opacity="0.9"/>
    <text x="232" y="232" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">BARAN</text>

    <!-- Bilasgarh marker -->
    <circle cx="245" cy="220" r="6" fill="#ffd700" stroke="#3a2a20" stroke-width="2"/>
    <line x1="245" y1="220" x2="285" y2="195" stroke="#3a2a20" stroke-width="1"/>
    <text x="290" y="198" font-size="11" font-weight="bold" fill="#8B0000">BILASGARH</text>

    <!-- Other key cities -->
    <circle cx="170" cy="120" r="4" fill="#3a2a20"/>
    <text x="178" y="118" font-size="10" fill="#3a2a20">Jaipur</text>

    <circle cx="100" cy="180" r="3" fill="#3a2a20"/>
    <text x="60" y="183" font-size="9" fill="#3a2a20">Jodhpur</text>

    <circle cx="75" cy="225" r="3" fill="#3a2a20"/>
    <text x="35" y="228" font-size="9" fill="#3a2a20">Udaipur</text>

    <circle cx="60" cy="125" r="3" fill="#3a2a20"/>
    <text x="20" y="128" font-size="9" fill="#3a2a20">Bikaner</text>

    <circle cx="210" cy="220" r="3" fill="#3a2a20"/>
    <text x="160" y="217" font-size="9" fill="#3a2a20">Kota</text>

    <!-- Compass rose -->
    <g transform="translate(50, 280)">
      <circle cx="0" cy="0" r="18" fill="#fff" stroke="#3a2a20" stroke-width="1.2"/>
      <polygon points="0,-14 4,0 0,14 -4,0" fill="#8B0000"/>
      <text x="0" y="-22" font-size="9" text-anchor="middle" fill="#3a2a20" font-weight="bold">N</text>
    </g>

    <!-- Legend -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="14" height="12" fill="#c97a5a"/>
      <text x="20" y="10" font-size="10" fill="#3a2a20">Baran District (Hadoti region)</text>
      <circle cx="7" cy="32" r="5" fill="#ffd700" stroke="#3a2a20" stroke-width="1.5"/>
      <text x="20" y="35" font-size="10" fill="#3a2a20">Bilasgarh ruins</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="400" y="685" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Stylized geographic schematic — not to scale; for orientation only
  </text>
</svg>
