<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#f9f4ed"/>

  <text x="400" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 8 — EVIDENCE PYRAMID</text>
  <text x="400" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#666">What is verified · what is documented · what is folklore · what is speculation</text>

  <!-- Pyramid tiers -->
  <g>
    <!-- Tier 1: VERIFIED (top, narrow) -->
    <polygon points="350,90 450,90 470,130 330,130" fill="#2c5a2c" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="400" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">VERIFIED</text>

    <!-- Tier 2: DOCUMENTED -->
    <polygon points="330,135 470,135 495,185 305,185" fill="#5b8db5" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="400" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">DOCUMENTED</text>

    <!-- Tier 3: THEORY -->
    <polygon points="305,190 495,190 525,245 275,245" fill="#d4a574" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="400" y="222" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">INFERRED / THEORY</text>

    <!-- Tier 4: FOLKLORE -->
    <polygon points="275,250 525,250 560,310 240,310" fill="#c97a5a" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="400" y="284" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">FOLKLORE</text>

    <!-- Tier 5: SPECULATION (base, widest) -->
    <polygon points="240,315 560,315 605,380 195,380" fill="#888" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="400" y="352" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">SPECULATION / RUMOUR</text>
  </g>

  <!-- Right side: examples per tier -->
  <g font-size="9">
    <!-- VERIFIED -->
    <line x1="470" y1="110" x2="615" y2="110" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="620" y="105" font-weight="bold" fill="#2c5a2c">VERIFIED</text>
    <text x="620" y="118" fill="#1a1a1a">• Site exists; Charkhambha pillars survive</text>

    <!-- DOCUMENTED -->
    <line x1="495" y1="160" x2="615" y2="160" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="620" y="155" font-weight="bold" fill="#5b8db5">DOCUMENTED</text>
    <text x="620" y="168" fill="#1a1a1a">• ~15,000 sculptures broken</text>
    <text x="620" y="180" fill="#1a1a1a">• Govt. Museum Baran (2020) holds finds</text>

    <!-- THEORY -->
    <line x1="525" y1="220" x2="615" y2="220" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="620" y="215" font-weight="bold" fill="#8a6532">INFERRED</text>
    <text x="620" y="228" fill="#1a1a1a">• Bilasgarh = Malava capital "Karkota-</text>
    <text x="620" y="240" fill="#1a1a1a">  nagara" (from coin evidence)</text>

    <!-- FOLKLORE -->
    <line x1="560" y1="282" x2="615" y2="282" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="620" y="277" font-weight="bold" fill="#8b3a1a">FOLKLORE</text>
    <text x="620" y="290" fill="#1a1a1a">• Khechi princess &amp; Aurangzeb</text>
    <text x="620" y="302" fill="#1a1a1a">• Kanya Dah suicide story</text>

    <!-- SPECULATION -->
    <line x1="600" y1="350" x2="615" y2="350" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="620" y="345" font-weight="bold" fill="#555">SPECULATION</text>
    <text x="620" y="358" fill="#1a1a1a">• Hidden treasure underground</text>
    <text x="620" y="370" fill="#1a1a1a">• Active paranormal hauntings</text>
  </g>

  <!-- Left side: criteria per tier -->
  <g font-size="9">
    <line x1="330" y1="110" x2="195" y2="110" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="190" y="105" text-anchor="end" font-weight="bold" fill="#2c5a2c">→ multi-source evidence</text>

    <line x1="305" y1="160" x2="195" y2="160" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="190" y="155" text-anchor="end" font-weight="bold" fill="#5b8db5">→ in official/museum records</text>

    <line x1="275" y1="220" x2="195" y2="220" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="190" y="215" text-anchor="end" font-weight="bold" fill="#8a6532">→ logical inference</text>
    <text x="190" y="228" text-anchor="end" fill="#1a1a1a">    (no inscription names city)</text>

    <line x1="240" y1="282" x2="195" y2="282" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="190" y="277" text-anchor="end" font-weight="bold" fill="#8b3a1a">→ oral tradition only</text>
    <text x="190" y="290" text-anchor="end" fill="#1a1a1a">    (no primary record)</text>

    <line x1="195" y1="350" x2="180" y2="350" stroke="#1a1a1a" stroke-width="0.6"/>
    <text x="178" y="345" text-anchor="end" font-weight="bold" fill="#555">→ no documented source</text>
  </g>

  <!-- Bottom usage note -->
  <g transform="translate(80, 410)">
    <rect x="0" y="0" width="640" height="65" fill="#fff" stroke="#3a2a20" stroke-width="1"/>
    <text x="320" y="20" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">FOR THE AUTHOR</text>
    <text x="320" y="38" font-size="9" text-anchor="middle" fill="#1a1a1a">
      The princess + Aurangzeb story is FOLKLORE (no primary source) but built on a DOCUMENTED kernel (the destruction itself).
    </text>
    <text x="320" y="54" font-size="9" text-anchor="middle" fill="#1a1a1a">
      Use it freely as legend; do not present it as proven historical fact.
    </text>
  </g>

  <text x="400" y="492" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Every claim in this dossier is tagged with one of these tiers
  </text>
</svg>
