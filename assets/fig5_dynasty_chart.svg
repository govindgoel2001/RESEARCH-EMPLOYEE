<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Georgia, serif">
  <rect width="800" height="620" fill="#f9f4ed"/>

  <text x="400" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 5 — DYNASTIES THAT RULED BILASGARH</text>
  <text x="400" y="52" font-size="11" font-style="italic" text-anchor="middle" fill="#666">Sequential succession from republican confederation to imperial destruction</text>

  <!-- Boxes (vertical flow chart) -->
  <g>
    <!-- Box 1: Malavas -->
    <rect x="200" y="80" width="400" height="62" fill="#d4a574" stroke="#3a2a20" stroke-width="1.5" rx="4"/>
    <text x="400" y="102" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">MALAVAS  (Malava Gana)</text>
    <text x="400" y="120" font-size="10" font-style="italic" text-anchor="middle" fill="#3a2a20">Republican tribal confederation · ~3rd c. BCE – 2nd c. CE</text>
    <text x="400" y="135" font-size="9" text-anchor="middle" fill="#3a2a20">Coins: "Malavanam jayah" — proof of capital status</text>

    <!-- Arrow -->
    <line x1="400" y1="142" x2="400" y2="172" stroke="#3a2a20" stroke-width="2"/>
    <polygon points="400,178 395,168 405,168" fill="#3a2a20"/>

    <!-- Box 2: Paramaras -->
    <rect x="200" y="180" width="400" height="62" fill="#c4a07a" stroke="#3a2a20" stroke-width="1.5" rx="4"/>
    <text x="400" y="202" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">PARAMARAS</text>
    <text x="400" y="220" font-size="10" font-style="italic" text-anchor="middle" fill="#3a2a20">Rajput dynasty · early medieval period</text>
    <text x="400" y="235" font-size="9" text-anchor="middle" fill="#3a2a20">Major regional power in western India/Malwa</text>

    <line x1="400" y1="242" x2="400" y2="272" stroke="#3a2a20" stroke-width="2"/>
    <polygon points="400,278 395,268 405,268" fill="#3a2a20"/>

    <!-- Box 3: Gaud Brahmins -->
    <rect x="200" y="280" width="400" height="62" fill="#b89366" stroke="#3a2a20" stroke-width="1.5" rx="4"/>
    <text x="400" y="302" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">GAUD BRAHMINS</text>
    <text x="400" y="320" font-size="10" font-style="italic" text-anchor="middle" fill="#3a2a20">Scholarly / administrative class · medieval</text>
    <text x="400" y="335" font-size="9" text-anchor="middle" fill="#3a2a20">Likely managed temples, gurukulas, civic life</text>

    <line x1="400" y1="342" x2="400" y2="372" stroke="#3a2a20" stroke-width="2"/>
    <polygon points="400,378 395,368 405,368" fill="#3a2a20"/>

    <!-- Box 4: Khichi Chauhans -->
    <rect x="200" y="380" width="400" height="62" fill="#a8835a" stroke="#3a2a20" stroke-width="1.5" rx="4"/>
    <text x="400" y="402" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">KHICHI CHAUHANS</text>
    <text x="400" y="420" font-size="10" font-style="italic" text-anchor="middle" fill="#fff">Subclan of Chauhan Rajputs · medieval – 17th c.</text>
    <text x="400" y="435" font-size="9" text-anchor="middle" fill="#fff">Last Hindu rulers · the princess of legend was of this line</text>

    <line x1="400" y1="442" x2="400" y2="472" stroke="#8B0000" stroke-width="2.5"/>
    <polygon points="400,478 395,468 405,468" fill="#8B0000"/>

    <!-- Box 5: Mughal destruction -->
    <rect x="200" y="480" width="400" height="78" fill="#8B0000" stroke="#3a2a20" stroke-width="1.5" rx="4"/>
    <text x="400" y="504" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">MUGHAL CONQUEST · AURANGZEB</text>
    <text x="400" y="522" font-size="10" font-style="italic" text-anchor="middle" fill="#fff">1658 – 1707 CE</text>
    <text x="400" y="540" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffd700">City destroyed · ~15,000 sculptures shattered</text>
    <text x="400" y="552" font-size="9" text-anchor="middle" fill="#fff">Never resettled. End of timeline.</text>
  </g>

  <!-- Side annotation -->
  <g transform="translate(620, 85)">
    <text x="0" y="0" font-size="9" font-style="italic" fill="#666">claim Prithviraj</text>
    <text x="0" y="12" font-size="9" font-style="italic" fill="#666">Chauhan ancestry →</text>
  </g>

  <!-- Legend / source note -->
  <text x="400" y="595" font-size="9" font-style="italic" text-anchor="middle" fill="#666">
    Status: Khichi Chauhans VERIFIED · Paramaras &amp; Gaud Brahmin sequence inferred · Aurangzeb destruction DOCUMENTED in tourism/historical sources, no primary Mughal record cited
  </text>
  <text x="400" y="608" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    The Khichi Chauhans were a real Rajput line of rulers in the Hadoti region
  </text>
</svg>
