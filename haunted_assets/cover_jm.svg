<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a"/>
      <stop offset="35%" stop-color="#1a1530"/>
      <stop offset="70%" stop-color="#2a2040"/>
      <stop offset="100%" stop-color="#1a1525"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="60%" stop-color="#f0d88a"/>
      <stop offset="100%" stop-color="#d8b860"/>
    </radialGradient>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2d3d"/>
      <stop offset="50%" stop-color="#151f2b"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <radialGradient id="reflectionGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0d88a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e2d3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#e8d8c8" opacity="0.65">
    <circle cx="50" cy="35" r="0.8"/><circle cx="120" cy="55" r="1.0"/>
    <circle cx="190" cy="28" r="0.7"/><circle cx="260" cy="70" r="0.9"/>
    <circle cx="320" cy="38" r="0.6"/><circle cx="400" cy="22" r="1.1"/>
    <circle cx="480" cy="58" r="0.8"/><circle cx="550" cy="32" r="0.7"/>
    <circle cx="630" cy="48" r="0.9"/><circle cx="720" cy="30" r="0.8"/>
    <circle cx="760" cy="70" r="0.6"/><circle cx="90" cy="95" r="0.5"/>
    <circle cx="170" cy="110" r="0.7"/><circle cx="280" cy="100" r="0.5"/>
    <circle cx="430" cy="88" r="0.6"/><circle cx="580" cy="92" r="0.7"/>
    <circle cx="690" cy="110" r="0.5"/><circle cx="740" cy="145" r="0.6"/>
    <circle cx="30" cy="145" r="0.7"/><circle cx="200" cy="160" r="0.5"/>
  </g>

  <!-- Moon with halo -->
  <circle cx="660" cy="95" r="55" fill="url(#moonGlow)" opacity="0.90"/>
  <circle cx="660" cy="95" r="75" fill="none" stroke="#f0d88a" stroke-width="1.2" opacity="0.14"/>
  <circle cx="660" cy="95" r="100" fill="none" stroke="#f0d88a" stroke-width="0.7" opacity="0.07"/>

  <!-- Aravalli hills silhouette (background) -->
  <path d="M 0,265 Q 60,235 130,248 Q 200,220 280,238 Q 360,210 450,230 Q 520,215 600,228 Q 670,218 740,232 Q 775,228 800,235 L 800,500 L 0,500 Z"
        fill="#1a1020" opacity="0.75"/>
  <!-- Second hill layer (closer, darker) -->
  <path d="M 0,285 Q 80,268 160,278 Q 240,262 340,272 Q 420,260 510,270 Q 590,258 680,268 Q 750,262 800,268 L 800,500 L 0,500 Z"
        fill="#110a18" opacity="0.7"/>

  <!-- Man Sagar Lake surface -->
  <ellipse cx="400" cy="390" rx="390" ry="95" fill="url(#lakeGrad)"/>
  <ellipse cx="400" cy="390" rx="390" ry="95" fill="url(#reflectionGrad)"/>

  <!-- Lake edge shimmer line -->
  <path d="M 10,338 Q 200,325 400,330 Q 600,325 790,338"
        fill="none" stroke="#3a5a6a" stroke-width="0.8" opacity="0.5"/>

  <!-- Moon reflection on lake -->
  <ellipse cx="660" cy="375" rx="35" ry="5" fill="#f0d88a" opacity="0.28"/>
  <ellipse cx="660" cy="385" rx="25" ry="3.5" fill="#f0d88a" opacity="0.18"/>
  <ellipse cx="660" cy="393" rx="18" ry="2.5" fill="#f0d88a" opacity="0.12"/>
  <ellipse cx="660" cy="400" rx="12" ry="2" fill="#f0d88a" opacity="0.08"/>

  <!-- Subtle lake ripples -->
  <g fill="none" stroke="#2a4a5a" stroke-width="0.5" opacity="0.4">
    <path d="M 100,375 Q 130,373 160,375"/>
    <path d="M 220,385 Q 255,382 290,385"/>
    <path d="M 120,395 Q 155,393 190,395"/>
    <path d="M 300,380 Q 340,378 380,380"/>
    <path d="M 510,383 Q 545,381 580,383"/>
    <path d="M 180,408 Q 220,406 260,408"/>
  </g>

  <!-- Jal Mahal Palace silhouette in the lake -->
  <g transform="translate(305, 300)">
    <!-- Palace base / water reflection foundation -->
    <ellipse cx="95" cy="72" rx="105" ry="12" fill="#0d1520" opacity="0.6"/>

    <!-- Main palace body -->
    <rect x="20" y="18" width="150" height="54" fill="#1a0f0a" rx="1"/>

    <!-- Arched windows on main body — row -->
    <g fill="#2a1a0a" stroke="#3a2a1a" stroke-width="0.6">
      <path d="M 28,42 Q 34,35 40,42 L 40,58 L 28,58 Z"/>
      <path d="M 48,42 Q 54,35 60,42 L 60,58 L 48,58 Z"/>
      <path d="M 72,42 Q 78,35 84,42 L 84,58 L 72,58 Z"/>
      <path d="M 96,42 Q 102,35 108,42 L 108,58 L 96,58 Z"/>
      <path d="M 120,42 Q 126,35 132,42 L 132,58 L 120,58 Z"/>
      <path d="M 144,42 Q 150,35 156,42 L 156,58 L 144,58 Z"/>
    </g>

    <!-- Crenellated top of main wall -->
    <g fill="#1a0f0a">
      <rect x="18" y="10" width="8" height="10"/><rect x="30" y="10" width="8" height="10"/>
      <rect x="42" y="10" width="8" height="10"/><rect x="54" y="10" width="8" height="10"/>
      <rect x="66" y="10" width="8" height="10"/><rect x="78" y="10" width="8" height="10"/>
      <rect x="90" y="10" width="8" height="10"/><rect x="102" y="10" width="8" height="10"/>
      <rect x="114" y="10" width="8" height="10"/><rect x="126" y="10" width="8" height="10"/>
      <rect x="138" y="10" width="8" height="10"/><rect x="150" y="10" width="8" height="10"/>
      <rect x="162" y="10" width="8" height="10"/>
    </g>

    <!-- Four corner chhatris (domed kiosks) — Rajput style -->
    <!-- Left chhatri -->
    <rect x="8" y="0" width="22" height="20" fill="#160c08"/>
    <path d="M 7,-1 Q 19,-12 31,-1" fill="#160c08" stroke="#2a1a0a" stroke-width="0.8"/>

    <!-- Right chhatri -->
    <rect x="160" y="0" width="22" height="20" fill="#160c08"/>
    <path d="M 159,-1 Q 171,-12 183,-1" fill="#160c08" stroke="#2a1a0a" stroke-width="0.8"/>

    <!-- Center chhatri (slightly taller) -->
    <rect x="82" y="-8" width="26" height="20" fill="#160c08"/>
    <path d="M 80,-10 Q 95,-22 110,-10" fill="#160c08" stroke="#2a1a0a" stroke-width="0.8"/>

    <!-- Inner secondary chhatris -->
    <rect x="42" y="-2" width="18" height="16" fill="#150b07"/>
    <path d="M 41,-3 Q 51,-12 61,-3" fill="#150b07" stroke="#2a1a0a" stroke-width="0.6"/>

    <rect x="130" y="-2" width="18" height="16" fill="#150b07"/>
    <path d="M 129,-3 Q 139,-12 149,-3" fill="#150b07" stroke="#2a1a0a" stroke-width="0.6"/>

    <!-- Edge highlight from moonlight on right side -->
    <rect x="168" y="18" width="2" height="54" fill="#3a2510" opacity="0.6"/>
    <rect x="186" y="0" width="2" height="20" fill="#3a2510" opacity="0.5"/>

    <!-- Palace reflection in water (mirrored, faded) -->
    <g opacity="0.3" transform="translate(0, 75) scale(1, -0.6)">
      <rect x="20" y="18" width="150" height="54" fill="#3a2a18"/>
      <rect x="8" y="0" width="22" height="20" fill="#2a1a10"/>
      <rect x="160" y="0" width="22" height="20" fill="#2a1a10"/>
      <rect x="82" y="-8" width="26" height="20" fill="#2a1a10"/>
    </g>
  </g>

  <!-- Migratory birds (bar-headed geese — famous at Man Sagar) -->
  <g stroke="#0a0d1a" stroke-width="0.9" fill="none" opacity="0.65">
    <path d="M 150,175 q 5,-5 10,0 q 5,-5 10,0"/>
    <path d="M 178,185 q 4,-4 8,0 q 4,-4 8,0"/>
    <path d="M 200,170 q 4,-4 8,0 q 4,-4 8,0"/>
    <path d="M 165,165 q 3,-3 6,0 q 3,-3 6,0"/>
  </g>

  <!-- Title overlay -->
  <text x="400" y="48" font-size="10" letter-spacing="4" text-anchor="middle" fill="#d8c8a0" opacity="0.8">RESEARCH DOSSIER · MAY 2026</text>

  <!-- Mist wisps on water -->
  <g opacity="0.14" fill="#d0c8b0">
    <ellipse cx="150" cy="358" rx="80" ry="5"/>
    <ellipse cx="540" cy="352" rx="100" ry="5"/>
    <ellipse cx="720" cy="360" rx="65" ry="4"/>
  </g>

  <!-- Bottom title bar -->
  <rect x="0" y="460" width="800" height="40" fill="#080508" opacity="0.88"/>
  <text x="400" y="485" font-size="14" letter-spacing="6" text-anchor="middle" fill="#d8c8a0" font-weight="bold">
    JAL MAHAL · MAN SAGAR LAKE · JAIPUR
  </text>
</svg>
