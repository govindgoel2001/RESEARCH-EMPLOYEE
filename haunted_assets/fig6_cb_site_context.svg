<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Georgia, serif">
  <rect width="800" height="540" fill="#f4f0ea"/>

  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 6 — SITE CONTEXT: ABHANERI VILLAGE &amp; CHAND BAORI</text>
  <text x="400" y="46" font-size="10" font-style="italic" text-anchor="middle" fill="#666">Stylized aerial view — stepwell, Harshat Mata temple, village, access road, agricultural land</text>

  <!-- Map canvas -->
  <rect x="40" y="62" width="720" height="420" fill="#c8d0a0" stroke="#5a4030" stroke-width="1.5" rx="2"/>

  <!-- Agricultural fields (green-ish patchwork surrounding the village) -->
  <!-- NW quadrant fields -->
  <rect x="52" y="74" width="100" height="70" fill="#a8c070" stroke="#88a050" stroke-width="0.6" opacity="0.6"/>
  <rect x="152" y="74" width="100" height="70" fill="#b8c878" stroke="#88a050" stroke-width="0.6" opacity="0.6"/>
  <rect x="52" y="144" width="100" height="70" fill="#b0c878" stroke="#88a050" stroke-width="0.6" opacity="0.6"/>
  <!-- NE quadrant fields -->
  <rect x="530" y="74" width="110" height="70" fill="#a8c070" stroke="#88a050" stroke-width="0.6" opacity="0.6"/>
  <rect x="640" y="74" width="110" height="70" fill="#b8c870" stroke="#88a050" stroke-width="0.6" opacity="0.6"/>
  <!-- SE fields -->
  <rect x="580" y="340" width="110" height="80" fill="#a8c068" stroke="#88a050" stroke-width="0.6" opacity="0.6"/>
  <rect x="640" y="240" width="110" height="100" fill="#b0c870" stroke="#88a050" stroke-width="0.6" opacity="0.6"/>
  <!-- S fields -->
  <rect x="220" y="400" width="120" height="72" fill="#a8c870" stroke="#88a050" stroke-width="0.6" opacity="0.6"/>
  <rect x="370" y="410" width="120" height="62" fill="#b0c868" stroke="#88a050" stroke-width="0.6" opacity="0.6"/>

  <!-- Field labels -->
  <text x="102" y="112" font-size="8" font-style="italic" fill="#5a7030" text-anchor="middle">fields</text>
  <text x="202" y="112" font-size="8" font-style="italic" fill="#5a7030" text-anchor="middle">fields</text>
  <text x="585" y="112" font-size="8" font-style="italic" fill="#5a7030" text-anchor="middle">fields</text>
  <text x="695" y="112" font-size="8" font-style="italic" fill="#5a7030" text-anchor="middle">fields</text>

  <!-- Village of Abhaneri (cluster of buildings) -->
  <ellipse cx="395" cy="265" rx="130" ry="105" fill="#ddd0a8" stroke="#8a7050" stroke-width="1.5" opacity="0.7"/>
  <!-- Village buildings (small rectangles scattered) -->
  <g fill="#c8b880" stroke="#8a6840" stroke-width="0.8">
    <rect x="310" y="220" width="22" height="16"/><rect x="338" y="215" width="18" height="14"/>
    <rect x="360" y="218" width="20" height="15"/><rect x="384" y="215" width="16" height="14"/>
    <rect x="406" y="218" width="22" height="16"/><rect x="432" y="222" width="18" height="15"/>
    <rect x="452" y="228" width="16" height="13"/><rect x="460" y="244" width="20" height="16"/>
    <rect x="448" y="266" width="18" height="14"/><rect x="426" y="278" width="20" height="15"/>
    <rect x="400" y="285" width="16" height="13"/><rect x="374" y="282" width="18" height="14"/>
    <rect x="348" y="278" width="20" height="15"/><rect x="326" y="268" width="18" height="14"/>
    <rect x="316" y="248" width="16" height="13"/><rect x="318" y="234" width="18" height="15"/>
  </g>
  <text x="395" y="208" font-size="11" font-style="italic" text-anchor="middle" fill="#5a4030">Abhaneri village</text>

  <!-- ══ CHAND BAORI (main feature) ══ -->
  <g transform="translate(260, 220)">
    <!-- Outer rim of the stepwell -->
    <rect x="-55" y="-42" width="110" height="84" fill="#c8b070" stroke="#5a3020" stroke-width="2.5" rx="1"/>
    <!-- Inner tiers (concentric) -->
    <rect x="-44" y="-33" width="88" height="66" fill="#b8a060"/>
    <rect x="-33" y="-24" width="66" height="48" fill="#a89050"/>
    <rect x="-22" y="-15" width="44" height="30" fill="#988040"/>
    <rect x="-11" y="-6" width="22" height="12" fill="#887030"/>
    <!-- Water at center -->
    <rect x="-5" y="-2" width="10" height="4" fill="#5b8db5"/>
    <!-- Pavilion wall (north/top side) — thicker, different color -->
    <rect x="-55" y="-42" width="110" height="12" fill="#d4a860" stroke="#8a5a20" stroke-width="1.5"/>
    <text x="0" y="-48" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">CHAND BAORI</text>
    <text x="0" y="-38" font-size="7.5" text-anchor="middle" fill="#fff">Pavilion (N)</text>
    <text x="0" y="52" font-size="8.5" font-style="italic" text-anchor="middle" fill="#5a2020">c. 800 CE · 13 floors · 30m deep</text>
  </g>

  <!-- Pavilion label callout -->
  <line x1="222" y1="178" x2="200" y2="158" stroke="#8a5a20" stroke-width="0.8"/>
  <text x="198" y="152" font-size="8" text-anchor="end" fill="#8a5a20">Ornate 3-storey</text>
  <text x="198" y="163" font-size="8" text-anchor="end" fill="#8a5a20">pavilion with</text>
  <text x="198" y="174" font-size="8" text-anchor="end" fill="#8a5a20">carved niches</text>

  <!-- ══ HARSHAT MATA TEMPLE (adjacent, slightly NE of stepwell) ══ -->
  <g transform="translate(330, 198)">
    <rect x="-28" y="-20" width="56" height="40" fill="#c8a060" stroke="#8a5a20" stroke-width="2"/>
    <!-- Temple shikhara (tower) -->
    <polygon points="0,-34 8,-20 -8,-20" fill="#d4a860" stroke="#8a5a20" stroke-width="1.2"/>
    <circle cx="0" cy="-36" r="5" fill="#e8c070" stroke="#8a5a20" stroke-width="1"/>
    <!-- Temple door -->
    <path d="M -6,-4 Q 0,-12 6,-4 L 6,10 L -6,10 Z" fill="#5a3020"/>
    <text x="0" y="-42" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#8a5a20">HARSHAT</text>
    <text x="0" y="-52" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#8a5a20">MATA</text>
    <text x="0" y="30" font-size="7.5" font-style="italic" text-anchor="middle" fill="#5a3010">Temple</text>
  </g>
  <!-- Connector between temple and stepwell -->
  <line x1="302" y1="198" x2="326" y2="198" stroke="#8a5a20" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="314" y="192" font-size="7" text-anchor="middle" fill="#8a5a20">adjacent</text>

  <!-- Harshat Mata Museum (small, adjacent to temple) -->
  <rect x="360" y="182" width="34" height="22" fill="#e8d8a8" stroke="#8a6840" stroke-width="1"/>
  <text x="377" y="191" font-size="7" text-anchor="middle" fill="#5a3020">ASI</text>
  <text x="377" y="201" font-size="7" text-anchor="middle" fill="#5a3020">Museum</text>

  <!-- Access road from village to stepwell -->
  <path d="M 210,275 Q 225,270 210,262 Q 205,258 205,248 Q 205,238 214,230"
        fill="none" stroke="#e8d0a0" stroke-width="6" opacity="0.8"/>
  <path d="M 210,275 Q 225,270 210,262 Q 205,258 205,248 Q 205,238 214,230"
        fill="none" stroke="#c8a870" stroke-width="1.5"/>
  <text x="194" y="256" font-size="8" text-anchor="end" fill="#8a6830">access</text>
  <text x="194" y="267" font-size="8" text-anchor="end" fill="#8a6830">path</text>

  <!-- Main village road connecting to the outside world -->
  <path d="M 40,295 Q 80,290 130,285 Q 170,282 210,282"
        fill="none" stroke="#e8c040" stroke-width="8" opacity="0.8"/>
  <path d="M 40,295 Q 80,290 130,285 Q 170,282 210,282"
        fill="none" stroke="#c8a020" stroke-width="1.5"/>
  <text x="112" y="278" font-size="8.5" font-weight="bold" fill="#8a6010">State Road → Bandikui / NH-21</text>

  <!-- Well / water feature in village (local water supply) -->
  <circle cx="440" cy="250" r="8" fill="#5b8db5" stroke="#2a5a7a" stroke-width="1.2" opacity="0.7"/>
  <text x="452" y="248" font-size="7.5" fill="#2a5a7a">village well</text>

  <!-- Small temple in village -->
  <g transform="translate(470, 280)">
    <rect x="-10" y="-8" width="20" height="16" fill="#d4c090" stroke="#8a6040" stroke-width="1"/>
    <polygon points="0,-14 5,-8 -5,-8" fill="#d4c090" stroke="#8a6040" stroke-width="0.8"/>
    <text x="0" y="22" font-size="7" text-anchor="middle" fill="#5a4030">local</text>
    <text x="0" y="31" font-size="7" text-anchor="middle" fill="#5a4030">mandir</text>
  </g>

  <!-- Compass -->
  <g transform="translate(696, 100)">
    <circle cx="0" cy="0" r="22" fill="#fff" stroke="#5a4030" stroke-width="1.5"/>
    <polygon points="0,-15 4,0 0,15 -4,0" fill="#8B0000"/>
    <text x="0" y="-26" font-size="12" font-weight="bold" text-anchor="middle" fill="#3a2a20">N</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(60, 462)">
    <text x="340" y="14" font-size="9" font-style="italic" text-anchor="middle" fill="#555">
      The stepwell and the Harshat Mata temple form a single sacred complex. The temple is a working place of worship; the stepwell is an ASI protected monument.
    </text>
    <text x="340" y="28" font-size="9" font-style="italic" text-anchor="middle" fill="#555">
      Abhaneri has no tourist infrastructure within the village — no hotels, no restaurants. All accommodation is in Jaipur or Dausa.
    </text>
  </g>

  <text x="400" y="530" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Stylized aerial schematic — positions approximate; not surveyed
  </text>
</svg>
