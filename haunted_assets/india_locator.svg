<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Georgia, serif">
  <rect width="800" height="620" fill="#f4f0ea"/>

  <text x="400" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">INDIA — TEN HAUNTED SITES: NATIONAL LOCATOR MAP</text>
  <text x="400" y="48" font-size="10" font-style="italic" text-anchor="middle" fill="#666">Geographical distribution across India</text>

  <!-- India stylised outline -->
  <path d="M 260,75 L 310,60 L 370,58 L 420,65 L 465,75 L 505,88
           L 535,105 L 558,128 L 570,155 L 575,185 L 572,215
           L 558,250 L 538,285 L 515,318 L 488,348 L 460,378
           L 432,405 L 405,428 L 380,448 L 355,462 L 335,472
           L 318,478 L 310,485 L 305,490 L 300,495 L 298,492
           L 290,480 L 278,460 L 265,435 L 252,405 L 242,370
           L 235,335 L 230,295 L 228,255 L 230,215 L 235,178
           L 242,142 L 252,110 L 265,85 Z"
        fill="#e8dcc8" stroke="#5a4030" stroke-width="1.8"/>

  <!-- State boundary hints (subtle lines for key states) -->
  <!-- Rajasthan boundary rough -->
  <path d="M 260,120 L 310,105 L 355,108 L 390,125 L 400,165 L 385,200 L 350,215 L 310,210 L 275,190 L 260,155 Z"
        fill="none" stroke="#8a6a4a" stroke-width="0.7" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Delhi box -->
  <rect x="328" y="144" width="14" height="14" fill="none" stroke="#8a6a4a" stroke-width="0.7" stroke-dasharray="2,2" opacity="0.5"/>

  <!-- Maharashtra rough -->
  <path d="M 290,295 L 340,278 L 390,285 L 415,310 L 405,345 L 368,360 L 325,352 L 295,330 Z"
