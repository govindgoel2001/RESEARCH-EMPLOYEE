    <text x="0" y="20" font-size="9" fill="#1a1a1a">0</text>
    <text x="44" y="20" font-size="9" fill="#1a1a1a">250</text>
    <text x="96" y="20" font-size="9" fill="#1a1a1a">500 km</text>
  </g>

  <!-- Legend -->
  <g transform="translate(560, 545)">
    <rect x="0" y="-8" width="195" height="38" fill="#fff" stroke="#5a4030" stroke-width="1"/>
    <circle cx="12" cy="8" r="7" fill="#8B0000" stroke="#1a1a1a" stroke-width="1"/>
    <text x="12" y="12" font-size="8" font-weight="bold" text-anchor="middle" fill="#fff">N</text>
    <text x="25" y="12" font-size="9" fill="#1a1a1a">Haunted site (numbered)</text>
