  <line x1="372" y1="438" x2="220" y2="465" stroke="#8B0000" stroke-width="0.7"/>
  <text x="218" y="462" font-size="9" font-weight="bold" text-anchor="end" fill="#8B0000">⑩ Fernhill Hotel</text>
