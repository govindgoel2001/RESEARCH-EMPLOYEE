  <!-- Site markers and labels -->

  <!-- 1. Bhangarh Fort, Alwar, Rajasthan -->
  <g transform="translate(308, 172)">
    <circle r="7" fill="#8B0000" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="0" y="3" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
  </g>
  <line x1="308" y1="172" x2="180" y2="158" stroke="#8B0000" stroke-width="0.7"/>
