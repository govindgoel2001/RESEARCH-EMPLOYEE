  <g transform="translate(372, 438)">
    <circle r="7" fill="#8B0000" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="0" y="3" font-size="9" font-weight="bold" text-anchor="middle" fill="#fff">10</text>
