    <text x="0" y="-28" font-size="11" font-weight="bold" text-anchor="middle" fill="#3a2a20">N</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="50" height="7" fill="#1a1a1a"/>
