  <!-- West Bengal -->
  <path d="M 485,185 L 510,180 L 528,200 L 525,235 L 505,248 L 482,235 L 478,210 Z"
        fill="none" stroke="#8a6a4a" stroke-width="0.7" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Gujarat -->
  <path d="M 248,195 L 278,185 L 298,200 L 295,235 L 270,248 L 248,232 Z"
        fill="none" stroke="#8a6a4a" stroke-width="0.7" stroke-dasharray="3,2" opacity="0.5"/>

