<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Georgia, serif">
  <rect width="800" height="540" fill="#f4f0ea"/>

  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 2 — REGIONAL MAP: JAIPUR–DAUSA–ABHANERI CORRIDOR</text>
  <text x="400" y="46" font-size="10" font-style="italic" text-anchor="middle" fill="#666">The Jaipur–Agra highway (NH-21) · Abhaneri village · Dausa town · Bandikui junction</text>

  <!-- Map canvas -->
  <rect x="40" y="62" width="720" height="420" fill="#d8cdb8" stroke="#5a4030" stroke-width="1.5" rx="2"/>

  <!-- Aravalli hills (SW of the map, running NE-SW) -->
  <path d="M 40,62 Q 80,80 120,90 Q 160,100 200,108 Q 250,112 290,118 Q 320,120 340,118 L 340,62 Z"
        fill="#b0a888" opacity="0.65"/>
  <text x="190" y="90" font-size="10" font-style="italic" fill="#6a5a40" font-weight="bold">Aravalli Hills</text>

  <!-- NH-21 highway (Jaipur to Agra) — runs roughly W to E across the map -->
  <path d="M 40,285 Q 100,280 160,278 Q 220,276 280,275 Q 340,274 400,275 Q 460,276 520,278 Q 580,280 640,282 Q 700,284 760,286"
        fill="none" stroke="#e8c040" stroke-width="10" opacity="0.85"/>
  <path d="M 40,285 Q 100,280 160,278 Q 220,276 280,275 Q 340,274 400,275 Q 460,276 520,278 Q 580,280 640,282 Q 700,284 760,286"
        fill="none" stroke="#c8a020" stroke-width="1.5"/>
  <text x="120" y="268" font-size="10" font-weight="bold" fill="#8a6010">NH-21  Jaipur → Agra</text>

  <!-- Jaipur city (west, off-map to the left) -->
  <g transform="translate(58, 265)">
    <rect x="-20" y="-18" width="40" height="30" fill="#c8a060" stroke="#8a6030" stroke-width="1.5" rx="2"/>
    <text x="0" y="-4" font-size="9" font-weight="bold" text-anchor="middle" fill="#3a2010">JAIPUR</text>
    <text x="0" y="8" font-size="7.5" text-anchor="middle" fill="#5a3010">95 km →</text>
  </g>

  <!-- Agra direction (east) -->
  <text x="738" y="270" font-size="9" fill="#8a6010" font-style="italic">→ Agra</text>
  <text x="738" y="282" font-size="8" fill="#8a6010" font-style="italic">(~180 km)</text>

  <!-- Bandikui town/junction (on highway, ~12 km from Abhaneri) -->
  <g transform="translate(480, 277)">
    <rect x="-26" y="-18" width="52" height="28" fill="#c8b890" stroke="#7a6040" stroke-width="1.2" rx="2"/>
    <text x="0" y="-4" font-size="9" font-weight="bold" text-anchor="middle" fill="#3a2010">BANDIKUI</text>
    <text x="0" y="8" font-size="7" text-anchor="middle" fill="#5a3010">Jn. (railway)</text>
  </g>

  <!-- Dausa town (district HQ, slightly north of highway) -->
  <g transform="translate(608, 248)">
    <rect x="-24" y="-18" width="48" height="30" fill="#d4b878" stroke="#8a6030" stroke-width="1.5" rx="2"/>
    <text x="0" y="-4" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#3a2010">DAUSA</text>
    <text x="0" y="8" font-size="7.5" text-anchor="middle" fill="#5a3010">District HQ</text>
  </g>

  <!-- Road from Bandikui/highway to Abhaneri (north turn off NH-21) -->
  <path d="M 480,259 Q 455,240 440,215 Q 420,190 400,170"
        fill="none" stroke="#c8b890" stroke-width="5" opacity="0.8"/>
  <path d="M 480,259 Q 455,240 440,215 Q 420,190 400,170"
        fill="none" stroke="#8a7050" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="448" y="215" font-size="8" fill="#5a4030" font-style="italic">~12 km</text>
  <text x="448" y="227" font-size="8" fill="#5a4030" font-style="italic">side road</text>

  <!-- Road from Dausa to Abhaneri -->
  <path d="M 608,232 Q 570,210 530,192 Q 500,178 400,170"
        fill="none" stroke="#c8b890" stroke-width="5" opacity="0.8"/>
  <path d="M 608,232 Q 570,210 530,192 Q 500,178 400,170"
        fill="none" stroke="#8a7050" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="520" y="185" font-size="8" fill="#5a4030" font-style="italic">~40 km</text>

  <!-- Abhaneri village — the focal point -->
  <g transform="translate(400, 155)">
    <!-- Village spread -->
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="#e8d8a8" stroke="#8a6a40" stroke-width="1.5" opacity="0.7"/>
    <!-- Chand Baori icon (simplified rectangle with steps) -->
    <rect x="-18" y="-14" width="36" height="28" fill="#c8a878" stroke="#5a3020" stroke-width="2"/>
    <line x1="-18" y1="-6" x2="18" y2="-6" stroke="#5a3020" stroke-width="0.8"/>
    <line x1="-18" y1="2" x2="18" y2="2" stroke="#5a3020" stroke-width="0.8"/>
    <line x1="-18" y1="8" x2="18" y2="8" stroke="#5a3020" stroke-width="0.8"/>
    <line x1="-6" y1="-14" x2="-6" y2="14" stroke="#5a3020" stroke-width="0.8"/>
    <line x1="6" y1="-14" x2="6" y2="14" stroke="#5a3020" stroke-width="0.8"/>
    <text x="0" y="-22" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">ABHANERI</text>
    <text x="0" y="-10" font-size="7.5" text-anchor="middle" fill="#fff">CHAND</text>
    <text x="0" y="0" font-size="7.5" text-anchor="middle" fill="#fff">BAORI</text>
    <text x="0" y="44" font-size="8.5" font-style="italic" text-anchor="middle" fill="#5a2020">Harshat Mata temple adjacent</text>
  </g>

  <!-- Railway line (Jaipur–Delhi via Bandikui) -->
  <path d="M 40,310 Q 140,308 240,307 Q 340,306 440,307 Q 520,308 580,310"
        fill="none" stroke="#5a4030" stroke-width="4" opacity="0.5"/>
  <path d="M 40,310 Q 140,308 240,307 Q 340,306 440,307 Q 520,308 580,310"
        fill="none" stroke="#8a7050" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="200" y="326" font-size="8" fill="#5a4030" font-style="italic">Jaipur–Delhi Railway (broad gauge)</text>

  <!-- Bandikui railway station marker -->
  <rect x="466" y="302" width="30" height="14" fill="#5a4030" opacity="0.7" rx="1"/>
  <text x="481" y="313" font-size="7" text-anchor="middle" fill="#fff">Stn.</text>

  <!-- Compass -->
  <g transform="translate(688, 100)">
    <circle cx="0" cy="0" r="24" fill="#fff" stroke="#5a4030" stroke-width="1.5"/>
    <polygon points="0,-16 4,0 0,16 -4,0" fill="#8B0000"/>
    <text x="0" y="-24" font-size="12" font-weight="bold" text-anchor="middle" fill="#3a2a20">N</text>
  </g>

  <!-- Distance table box -->
  <g transform="translate(54, 370)">
    <rect x="0" y="0" width="340" height="95" fill="#fff" stroke="#3a2a20" stroke-width="1.2" rx="1"/>
    <text x="170" y="18" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">KEY DISTANCES FROM ABHANERI</text>
    <text x="10" y="34" font-size="8.5" fill="#1a1a1a">• Jaipur City Centre:   95 km  (~2 hrs by road)</text>
    <text x="10" y="48" font-size="8.5" fill="#1a1a1a">• Dausa Town:          40 km  (~45 min)</text>
    <text x="10" y="62" font-size="8.5" fill="#1a1a1a">• Bandikui Junction:   12 km  (~20 min)</text>
    <text x="10" y="76" font-size="8.5" fill="#1a1a1a">• Delhi:              230 km  (~3.5 hrs via NH-21)</text>
    <text x="10" y="90" font-size="8.5" fill="#1a1a1a">• Bhangarh Fort:       75 km  (~1.5 hrs via Dausa)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(440, 370)">
    <rect x="0" y="0" width="310" height="95" fill="#fff" stroke="#3a2a20" stroke-width="1.2" rx="1"/>
    <text x="155" y="18" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">MAP LEGEND</text>
    <rect x="10" y="28" width="28" height="8" fill="#e8c040" stroke="#c8a020" stroke-width="0.8"/>
    <text x="44" y="36" font-size="8.5" fill="#1a1a1a">National Highway (NH-21)</text>
    <line x1="10" y1="54" x2="38" y2="54" stroke="#8a7050" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="44" y="57" font-size="8.5" fill="#1a1a1a">State / district road</text>
    <line x1="10" y1="72" x2="38" y2="72" stroke="#8a7050" stroke-width="3" stroke-dasharray="7,4" opacity="0.6"/>
    <text x="44" y="75" font-size="8.5" fill="#1a1a1a">Railway (broad gauge)</text>
    <rect x="10" y="83" width="12" height="8" fill="#c8a878" stroke="#5a3020" stroke-width="1"/>
    <text x="28" y="91" font-size="8.5" fill="#1a1a1a">Chand Baori / heritage site</text>
  </g>

  <text x="400" y="530" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Schematic map — road distances approximate; verify with current navigation before travel
  </text>
</svg>
