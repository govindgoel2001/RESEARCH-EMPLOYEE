<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Georgia, serif">
  <rect width="800" height="540" fill="#f4f0ea"/>

  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 6 — SITE CONTEXT: GULF OF KHAMBHAT &amp; DUMAS COAST</text>
  <text x="400" y="46" font-size="10" font-style="italic" text-anchor="middle" fill="#666">Tidal patterns · industrial backdrop · Tapi River estuary · Suvali Beach · the full coastal character</text>

  <!-- Map canvas -->
  <rect x="40" y="62" width="720" height="425" fill="#c8d4b0" stroke="#5a4030" stroke-width="1.5" rx="2"/>

  <!-- Gulf of Khambhat (upper left — water body) -->
  <path d="M 40,62 L 280,62 L 280,200 Q 240,240 200,280 Q 170,320 160,360 Q 148,400 145,450 Q 143,460 142,487 L 40,487 Z"
        fill="#5090b8" opacity="0.65"/>
  <text x="105" y="180" font-size="12" font-style="italic" text-anchor="middle" fill="#1a4a7a" font-weight="bold">Gulf of</text>
  <text x="105" y="200" font-size="12" font-style="italic" text-anchor="middle" fill="#1a4a7a" font-weight="bold">Khambhat</text>

  <!-- Tidal range annotation in Gulf -->
  <rect x="52" y="108" width="164" height="44" fill="#fff" stroke="#2a5a7a" stroke-width="1" rx="1" opacity="0.85"/>
  <text x="134" y="124" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#2a5a7a">TIDAL RANGE WARNING</text>
  <text x="134" y="138" font-size="8" text-anchor="middle" fill="#1a1a1a">Up to 10–11 m in inner Gulf</text>
  <text x="134" y="148" font-size="7.5" font-style="italic" text-anchor="middle" fill="#8B0000">Among Asia's highest tides</text>

  <!-- Arabian Sea (bottom left) -->
  <path d="M 40,487 L 142,487 Q 143,460 145,450 Q 148,400 160,360 Q 170,320 200,280 Q 240,240 280,200 L 280,62 L 40,62 Z"
        fill="#5090b8" opacity="0"/>
  <!-- The coastal line (dividing sea from land) — diagonal running roughly NE-SW -->
  <path d="M 280,62 Q 285,120 288,180 Q 290,240 285,300 Q 280,360 270,420 Q 260,460 248,487"
        fill="none" stroke="#2a5a7a" stroke-width="2.5"/>
  <!-- Land area (east of coastline) -->

  <!-- Tapi River estuary (running E to W into Gulf) -->
  <path d="M 760,175 Q 700,173 620,172 Q 540,172 460,174 Q 400,176 340,180 Q 305,184 290,192 Q 283,198 280,210"
        fill="none" stroke="#5b8db5" stroke-width="9" opacity="0.7"/>
  <path d="M 760,175 Q 700,173 620,172 Q 540,172 460,174 Q 400,176 340,180 Q 305,184 290,192 Q 283,198 280,210"
        fill="none" stroke="#3a6a9a" stroke-width="2"/>
  <!-- Tapi River label -->
  <text x="560" y="165" font-size="11" font-weight="bold" fill="#2a5a7a" font-style="italic">Tapi River</text>
  <text x="560" y="179" font-size="8.5" fill="#2a5a7a" font-style="italic">(Tapti R.) — flows W through Surat</text>

  <!-- Tapi mouth/estuary -->
  <ellipse cx="282" cy="208" rx="22" ry="12" fill="#5b8db5" opacity="0.6"/>
  <text x="308" y="208" font-size="8" fill="#2a5a7a" font-style="italic">estuary</text>

  <!-- HAZIRA INDUSTRIAL PENINSULA -->
  <g transform="translate(310, 250)">
    <ellipse cx="0" cy="0" rx="55" ry="35" fill="#b8a880" stroke="#8a7050" stroke-width="1.5" opacity="0.85"/>
    <!-- Industrial chimneys -->
    <rect x="-40" y="-30" width="6" height="20" fill="#888"/>
    <rect x="-28" y="-34" width="6" height="24" fill="#888"/>
    <rect x="-16" y="-32" width="6" height="22" fill="#888"/>
    <rect x="-4" y="-30" width="6" height="20" fill="#888"/>
    <rect x="8" y="-28" width="6" height="18" fill="#888"/>
    <rect x="20" y="-32" width="6" height="22" fill="#888"/>
    <!-- Smoke -->
    <g stroke="#aaa" stroke-width="0.7" fill="none" opacity="0.5">
      <path d="M -37,-30 Q -35,-42 -33,-30"/><path d="M -25,-34 Q -23,-46 -21,-34"/>
      <path d="M -13,-32 Q -11,-44 -9,-32"/>
    </g>
    <text x="0" y="-44" font-size="9" font-weight="bold" text-anchor="middle" fill="#5a3010">HAZIRA</text>
    <text x="0" y="-54" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#5a3010">INDUSTRIAL ZONE</text>
    <text x="0" y="18" font-size="7.5" text-anchor="middle" fill="#6a5030">ONGC · NTPC · Essar</text>
    <text x="0" y="29" font-size="7.5" text-anchor="middle" fill="#6a5030">L&amp;T Shipyard</text>
  </g>

  <!-- SURAT CITY (northeast) -->
  <g transform="translate(600, 188)">
    <rect x="-55" y="-40" width="110" height="66" fill="#d0c0a0" stroke="#5a4030" stroke-width="1.5" rx="2"/>
    <g stroke="#a09070" stroke-width="0.6" opacity="0.5">
      <line x1="-35" y1="-40" x2="-35" y2="26"/><line x1="-15" y1="-40" x2="-15" y2="26"/>
      <line x1="5" y1="-40" x2="5" y2="26"/><line x1="25" y1="-40" x2="25" y2="26"/>
      <line x1="45" y1="-40" x2="45" y2="26"/>
      <line x1="-55" y1="-18" x2="55" y2="-18"/><line x1="-55" y1="4" x2="55" y2="4"/>
    </g>
    <text x="0" y="-18" font-size="13" font-weight="bold" text-anchor="middle" fill="#3a2010">SURAT</text>
    <text x="0" y="-2" font-size="9" text-anchor="middle" fill="#5a3020">City (pop. ~7M)</text>
    <text x="0" y="14" font-size="8" text-anchor="middle" fill="#8a6040">Diamond industry hub</text>
    <text x="0" y="26" font-size="7.5" text-anchor="middle" fill="#8a6040">Gujarat's 2nd largest city</text>
  </g>

  <!-- Road from Surat to Dumas (SH-6 / Dumas Road) -->
  <path d="M 560,210 Q 500,240 440,275 Q 390,300 345,325 Q 315,340 300,355 Q 285,365 280,380"
        fill="none" stroke="#e8c040" stroke-width="7" opacity="0.8"/>
  <path d="M 560,210 Q 500,240 440,275 Q 390,300 345,325 Q 315,340 300,355 Q 285,365 280,380"
        fill="none" stroke="#c8a020" stroke-width="1.5"/>
  <text x="410" y="300" font-size="8.5" fill="#8a6010">Dumas Road (SH-6)</text>
  <text x="410" y="314" font-size="8" fill="#8a6010">~21 km / 35 min</text>

  <!-- DUMAS BEACH (the primary site) -->
  <g transform="translate(278, 388)">
    <!-- Black sand indicator -->
    <rect x="-30" y="-22" width="60" height="40" fill="#1a1810" stroke="#8B0000" stroke-width="2.5" rx="1"/>
    <text x="0" y="-34" font-size="12" font-weight="bold" text-anchor="middle" fill="#8B0000">DUMAS BEACH</text>
    <text x="0" y="-44" font-size="8.5" text-anchor="middle" fill="#cc4444">Black sand cremation ground</text>
    <text x="0" y="-2" font-size="8" text-anchor="middle" fill="#e8d070">Black sand</text>
    <text x="0" y="10" font-size="8" text-anchor="middle" fill="#5b8db5">~~~~~~~~~~~~~</text>
  </g>

  <!-- Dumas Hanuman Temple marker -->
  <g transform="translate(308, 378)">
    <polygon points="0,-14 6,-6 -6,-6" fill="#d4a060" stroke="#8a5a20" stroke-width="1.2"/>
    <rect x="-8" y="-6" width="16" height="12" fill="#d4a060" stroke="#8a5a20" stroke-width="1.2"/>
    <text x="14" y="-4" font-size="7.5" fill="#8a5a20">Dariya Mahal</text>
    <text x="14" y="7" font-size="7.5" fill="#8a5a20">Hanuman Temple</text>
  </g>

  <!-- SUVALI BEACH (south, similar dark sand) -->
  <g transform="translate(256, 452)">
    <rect x="-25" y="-12" width="50" height="22" fill="#2a2820" stroke="#888" stroke-width="1" rx="1" opacity="0.8"/>
    <text x="0" y="-20" font-size="9" font-weight="bold" text-anchor="middle" fill="#888">SUVALI</text>
    <text x="0" y="-30" font-size="8" text-anchor="middle" fill="#888">Beach (~8 km S)</text>
    <text x="0" y="4" font-size="7.5" text-anchor="middle" fill="#a8a090">dark sand</text>
  </g>

  <!-- Compass -->
  <g transform="translate(696, 105)">
    <circle cx="0" cy="0" r="22" fill="#fff" stroke="#5a4030" stroke-width="1.5"/>
    <polygon points="0,-15 4,0 0,15 -4,0" fill="#8B0000"/>
    <text x="0" y="-25" font-size="12" font-weight="bold" text-anchor="middle" fill="#3a2a20">N</text>
  </g>

  <!-- Tide note box -->
  <g transform="translate(430, 405)">
    <rect x="0" y="0" width="318" height="65" fill="#fff8f0" stroke="#8B0000" stroke-width="1.2" rx="1"/>
    <text x="159" y="18" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8B0000">TIDAL DANGER CONTEXT</text>
    <text x="159" y="34" font-size="8.5" text-anchor="middle" fill="#1a1a1a">The Gulf of Khambhat's extreme tidal range</text>
    <text x="159" y="48" font-size="8.5" text-anchor="middle" fill="#1a1a1a">creates powerful in-rushing currents at night.</text>
    <text x="159" y="61" font-size="8" font-style="italic" text-anchor="middle" fill="#8B0000">Several drowning incidents at Dumas linked to tidal surge, not haunting.</text>
  </g>

  <text x="400" y="530" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Stylized aerial schematic — coastline positions approximate; industrial facilities schematic only
  </text>
</svg>
