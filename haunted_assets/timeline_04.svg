<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Georgia, serif">
  <rect width="700" height="380" fill="#f9f4ed"/>

  <text x="350" y="28" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SITE 04 — HISTORICAL TIMELINE</text>
  <text x="350" y="46" font-size="11" font-weight="bold" text-anchor="middle" fill="#2d5a2d">Dow Hill / Victoria Boys School</text>

  <!-- Timeline backbone -->
  <line x1="60" y1="220" x2="640" y2="220" stroke="#3a2a20" stroke-width="2.5"/>
  <polygon points="640,220 630,215 630,225" fill="#3a2a20"/>

  
    <!-- Event 1 above -->
    <circle cx="80" cy="220" r="6" fill="#2d5a2d" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="80" y1="212" x2="80" y2="190" stroke="#2d5a2d" stroke-width="1.2"/>
    <text x="80" y="152" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d5a2d">1879</text>
    <text x="80" y="148" font-size="9" text-anchor="middle" fill="#1a1a1a">Victoria Boys School</text>
<text x="80" y="161" font-size="9" text-anchor="middle" fill="#1a1a1a">founded by British</text>

    <!-- Event 2 below -->
    <circle cx="178" cy="220" r="6" fill="#2d5a2d" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="178" y1="228" x2="178" y2="248" stroke="#2d5a2d" stroke-width="1.2"/>
    <text x="178" y="242" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d5a2d">1900s</text>
    <text x="178" y="255" font-size="9" text-anchor="middle" fill="#1a1a1a">Worker deaths</text>
<text x="178" y="268" font-size="9" text-anchor="middle" fill="#1a1a1a">during school holidays</text>

    <!-- Event 3 above -->
    <circle cx="280" cy="220" r="6" fill="#2d5a2d" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="280" y1="212" x2="280" y2="190" stroke="#2d5a2d" stroke-width="1.2"/>
    <text x="280" y="152" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d5a2d">1947</text>
    <text x="280" y="148" font-size="9" text-anchor="middle" fill="#1a1a1a">School renamed;</text>
<text x="280" y="161" font-size="9" text-anchor="middle" fill="#1a1a1a">continues under state</text>

    <!-- Event 4 below -->
    <circle cx="380" cy="220" r="6" fill="#2d5a2d" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="380" y1="228" x2="380" y2="248" stroke="#2d5a2d" stroke-width="1.2"/>
    <text x="380" y="242" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d5a2d">1980s</text>
    <text x="380" y="255" font-size="9" text-anchor="middle" fill="#1a1a1a">Paranormal stories</text>
<text x="380" y="268" font-size="9" text-anchor="middle" fill="#1a1a1a">circulate locally</text>

    <!-- Event 5 above -->
    <circle cx="480" cy="220" r="6" fill="#2d5a2d" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="480" y1="212" x2="480" y2="190" stroke="#2d5a2d" stroke-width="1.2"/>
    <text x="480" y="152" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d5a2d">2000s</text>
    <text x="480" y="148" font-size="9" text-anchor="middle" fill="#1a1a1a">TV & YouTube</text>
<text x="480" y="161" font-size="9" text-anchor="middle" fill="#1a1a1a">explorations popularise</text>

    <!-- Event 6 below -->
    <circle cx="580" cy="220" r="6" fill="#2d5a2d" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="580" y1="228" x2="580" y2="248" stroke="#2d5a2d" stroke-width="1.2"/>
    <text x="580" y="242" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d5a2d">Present</text>
    <text x="580" y="255" font-size="9" text-anchor="middle" fill="#1a1a1a">Functioning school;</text>
<text x="580" y="268" font-size="9" text-anchor="middle" fill="#1a1a1a">forest path still feared</text>


  <text x="350" y="370" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Timeline is approximate; some dates inferred from regional history
  </text>
</svg>