<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Georgia, serif">
  <rect width="800" height="420" fill="#f9f4ed"/>

  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 3 — ROUTE DIAGRAM TO JAL MAHAL</text>
  <text x="400" y="46" font-size="10" font-style="italic" text-anchor="middle" fill="#666">Road, rail, and air approaches from major gateways</text>

  <!-- Main road line (horizontal backbone) -->
  <line x1="60" y1="210" x2="740" y2="210" stroke="#d4a020" stroke-width="3"/>
  <!-- Arrow right -->
  <polygon points="740,210 728,204 728,216" fill="#d4a020"/>

  <!-- ── Node: Delhi ── -->
  <circle cx="80" cy="210" r="22" fill="#3a2a20" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="206" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#fff">DELHI</text>
  <text x="80" y="218" font-size="7" text-anchor="middle" fill="#d8c8a0">NCR</text>

  <!-- Delhi rail icon -->
  <g transform="translate(80, 242)">
    <rect x="-18" y="-8" width="36" height="14" fill="none" stroke="#5a4030" stroke-width="1"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#5a4030" stroke-width="0.8"/>
    <circle cx="-12" cy="0" r="4" fill="#5a4030"/>
    <circle cx="12" cy="0" r="4" fill="#5a4030"/>
  </g>
  <text x="80" y="268" font-size="7.5" text-anchor="middle" fill="#3a2a20">Hazrat Nizamuddin</text>
  <text x="80" y="278" font-size="7" text-anchor="middle" fill="#555">Shatabdi 5h · ₹500+</text>

  <!-- Distance label Delhi→Jaipur -->
  <text x="205" y="198" font-size="9" font-weight="bold" text-anchor="middle" fill="#8B0000">287 km</text>
  <text x="205" y="210" font-size="8" text-anchor="middle" fill="#555">≈ 5 hrs by road</text>
  <text x="205" y="222" font-size="8" text-anchor="middle" fill="#555">NH-48 → Jaipur</text>

  <!-- ── Node: Agra ── -->
  <circle cx="240" cy="148" r="20" fill="#5a3a20" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="240" y="144" font-size="8" font-weight="bold" text-anchor="middle" fill="#fff">AGRA</text>
  <text x="240" y="156" font-size="7" text-anchor="middle" fill="#d8c8a0">UP</text>
  <!-- Agra road to Jaipur backbone -->
  <path d="M 240,168 Q 280,185 320,205" fill="none" stroke="#d4a020" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="260" y="178" font-size="7.5" fill="#8a6010">240 km · ~4.5 h</text>

  <!-- ── Node: Jaipur Junction ── -->
  <circle cx="420" cy="210" r="26" fill="#8B0000" stroke="#1a1a1a" stroke-width="2"/>
  <text x="420" y="205" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#fff">JAIPUR</text>
  <text x="420" y="218" font-size="8" text-anchor="middle" fill="#ffd8a0">Junction</text>

  <!-- Jaipur to Jal Mahal final leg -->
  <line x1="420" y1="184" x2="420" y2="108" stroke="#8B0000" stroke-width="2.5"/>
  <polygon points="420,108 414,120 426,120" fill="#8B0000"/>
  <text x="435" y="150" font-size="8.5" fill="#8B0000" font-weight="bold">10 km</text>
  <text x="435" y="162" font-size="8" fill="#555">NH-52 North</text>
  <text x="435" y="173" font-size="8" fill="#555">≈ 25 min taxi</text>

  <!-- Jal Mahal destination box -->
  <rect x="348" y="68" width="144" height="40" fill="#1a0a0a" stroke="#8B0000" stroke-width="2" rx="3"/>
  <text x="420" y="87" font-size="11" font-weight="bold" text-anchor="middle" fill="#d8c8a0">JAL MAHAL</text>
  <text x="420" y="100" font-size="8.5" font-style="italic" text-anchor="middle" fill="#a08868">Man Sagar Lake</text>

  <!-- Jaipur rail info -->
  <g transform="translate(420, 248)">
    <rect x="-22" y="-8" width="44" height="14" fill="none" stroke="#5a4030" stroke-width="1"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#5a4030" stroke-width="0.8"/>
    <circle cx="-14" cy="0" r="4" fill="#5a4030"/>
    <circle cx="14" cy="0" r="4" fill="#5a4030"/>
  </g>
  <text x="420" y="274" font-size="7.5" text-anchor="middle" fill="#3a2a20">Jaipur Junction</text>
  <text x="420" y="284" font-size="7" text-anchor="middle" fill="#555">Delhi Shatabdi / Rajdhani</text>

  <!-- Jaipur airport -->
  <g transform="translate(420, 300)">
    <!-- plane icon -->
    <path d="M -15,0 L 0,-8 L 15,0 L 8,3 L 8,8 L 0,6 L -8,8 L -8,3 Z" fill="#5a4a6a" stroke="#3a2a4a" stroke-width="0.8"/>
  </g>
  <text x="420" y="320" font-size="7.5" text-anchor="middle" fill="#3a2a4a">Sanganer Airport (JAI)</text>
  <text x="420" y="330" font-size="7" text-anchor="middle" fill="#555">Delhi 45 min · Mumbai 1h30</text>

  <!-- ── Node: Mumbai ── -->
  <circle cx="580" cy="310" r="22" fill="#3a2a40" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="580" y="306" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#fff">MUMBAI</text>
  <text x="580" y="318" font-size="7" text-anchor="middle" fill="#d8c8d8">MH</text>
  <!-- Mumbai to Jaipur -->
  <path d="M 580,288 Q 560,260 540,235 Q 515,220 460,212"
        fill="none" stroke="#d4a020" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="550" y="256" font-size="7.5" fill="#8a6010">1,149 km · NH-48</text>

  <!-- ── Node: Jodhpur ── -->
  <circle cx="690" cy="210" r="20" fill="#5a3a20" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="690" y="206" font-size="8" font-weight="bold" text-anchor="middle" fill="#fff">JODHPUR</text>
  <text x="690" y="218" font-size="7" text-anchor="middle" fill="#d8c8a0">RJ</text>
  <!-- Distance Jodhpur to Jaipur -->
  <text x="610" y="198" font-size="9" font-weight="bold" text-anchor="middle" fill="#8B0000">338 km</text>
  <text x="610" y="210" font-size="8" text-anchor="middle" fill="#555">≈ 5.5 hrs · NH-62</text>

  <!-- Golden Triangle note -->
  <g transform="translate(58, 350)">
    <rect x="0" y="0" width="684" height="40" fill="#fff3cd" stroke="#e6ac00" stroke-width="1"/>
    <text x="342" y="15" font-size="10" font-weight="bold" text-anchor="middle" fill="#5a4000">GOLDEN TRIANGLE NOTE</text>
    <text x="342" y="30" font-size="9" text-anchor="middle" fill="#5a4000">
      Delhi → Agra → Jaipur (and back to Delhi) is India's most-traveled tourist route. Jal Mahal is a standard stop on Jaipur day. Taxi/cab day-packages easily arranged from Jaipur.
    </text>
  </g>

  <text x="400" y="408" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Distances and times approximate; road conditions vary seasonally
  </text>
</svg>
