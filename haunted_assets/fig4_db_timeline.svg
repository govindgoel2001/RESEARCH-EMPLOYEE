<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Georgia, serif">
  <rect width="800" height="520" fill="#f9f4ed"/>

  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 4 — HISTORICAL TIMELINE: DUMAS BEACH</text>
  <text x="400" y="46" font-size="10" font-style="italic" text-anchor="middle" fill="#666">Mughal trading port era · plague years · cremation ground history · modern haunted reputation</text>

  <!-- Timeline spine -->
  <line x1="60" y1="238" x2="748" y2="238" stroke="#5a4030" stroke-width="2.5"/>
  <polygon points="748,233 762,238 748,243" fill="#5a4030"/>

  <!-- ═══ EVENT 1: c.1600s — Surat as major port / Dumas as cremation shore ═══ -->
  <line x1="88" y1="238" x2="88" y2="145" stroke="#5b8db5" stroke-width="1.5"/>
  <circle cx="88" cy="238" r="6" fill="#5b8db5" stroke="#2a5a9a" stroke-width="1.5"/>
  <rect x="38" y="76" width="102" height="69" fill="#fff" stroke="#5b8db5" stroke-width="1.2" rx="2"/>
  <text x="89" y="92" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#2a5a9a">c. 1600s</text>
  <text x="89" y="106" font-size="7.5" text-anchor="middle" fill="#1a1a1a">Surat: largest</text>
  <text x="89" y="118" font-size="7.5" text-anchor="middle" fill="#1a1a1a">Indian port, Mughal</text>
  <text x="89" y="130" font-size="7.5" text-anchor="middle" fill="#1a1a1a">era. Dumas coast</text>
  <text x="89" y="142" font-size="7.5" text-anchor="middle" fill="#1a1a1a">= city's cremation</text>

  <!-- ═══ EVENT 2: c.1700s — East India Company era ═══ -->
  <line x1="192" y1="238" x2="192" y2="298" stroke="#888" stroke-width="1.5"/>
  <circle cx="192" cy="238" r="5" fill="#888" stroke="#555" stroke-width="1.2"/>
  <rect x="142" y="298" width="102" height="56" fill="#fff" stroke="#888" stroke-width="1" rx="2"/>
  <text x="193" y="314" font-size="9" font-weight="bold" text-anchor="middle" fill="#555">1700s</text>
  <text x="193" y="328" font-size="7.5" text-anchor="middle" fill="#3a3a3a">British East India</text>
  <text x="193" y="340" font-size="7.5" text-anchor="middle" fill="#3a3a3a">Company controls</text>
  <text x="193" y="352" font-size="7.5" text-anchor="middle" fill="#3a3a3a">Surat (after 1707)</text>

  <!-- ═══ EVENT 3: 1837-1839 — Major epidemic period ═══ -->
  <line x1="298" y1="238" x2="298" y2="148" stroke="#8B0000" stroke-width="1.8"/>
  <circle cx="298" cy="238" r="6" fill="#cc2200" stroke="#8B0000" stroke-width="1.5"/>
  <rect x="242" y="76" width="112" height="72" fill="#ffe8e8" stroke="#8B0000" stroke-width="1.5" rx="2"/>
  <text x="298" y="92" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8B0000">1837–1839</text>
  <text x="298" y="106" font-size="7.5" text-anchor="middle" fill="#5a0000">Major epidemic</text>
  <text x="298" y="118" font-size="7.5" text-anchor="middle" fill="#5a0000">period in Surat.</text>
  <text x="298" y="130" font-size="7.5" text-anchor="middle" fill="#5a0000">Mass cremations</text>
  <text x="298" y="142" font-size="7.5" text-anchor="middle" fill="#5a0000">at Dumas shore</text>

  <!-- ═══ EVENT 4: ~1890s — British census documents cremation ground ═══ -->
  <line x1="388" y1="238" x2="388" y2="298" stroke="#5b8db5" stroke-width="1.5"/>
  <circle cx="388" cy="238" r="5" fill="#5b8db5" stroke="#2a5a9a" stroke-width="1.2"/>
  <rect x="338" y="298" width="102" height="56" fill="#fff" stroke="#5b8db5" stroke-width="1" rx="2"/>
  <text x="389" y="314" font-size="9" font-weight="bold" text-anchor="middle" fill="#2a5a9a">~1890s</text>
  <text x="389" y="328" font-size="7.5" text-anchor="middle" fill="#1a1a1a">British census</text>
  <text x="389" y="340" font-size="7.5" text-anchor="middle" fill="#1a1a1a">formally records</text>
  <text x="389" y="352" font-size="7.5" text-anchor="middle" fill="#1a1a1a">Dumas cremation</text>

  <!-- ═══ TRANSITION ERA: ~1970s — New crematoriums built ═══ -->
  <line x1="480" y1="238" x2="480" y2="148" stroke="#5a8a3a" stroke-width="1.5"/>
  <circle cx="480" cy="238" r="5" fill="#5a8a3a" stroke="#3a6a1a" stroke-width="1.2"/>
  <rect x="430" y="76" width="100" height="72" fill="#fff" stroke="#5a8a3a" stroke-width="1" rx="2"/>
  <text x="480" y="92" font-size="9" font-weight="bold" text-anchor="middle" fill="#3a6a1a">~1970s</text>
  <text x="480" y="106" font-size="7.5" text-anchor="middle" fill="#1a1a1a">New municipal</text>
  <text x="480" y="118" font-size="7.5" text-anchor="middle" fill="#1a1a1a">crematoriums in</text>
  <text x="480" y="130" font-size="7.5" text-anchor="middle" fill="#1a1a1a">Surat; beach use</text>
  <text x="480" y="142" font-size="7.5" font-style="italic" text-anchor="middle" fill="#3a6a1a">gradually declines</text>

  <!-- ═══ EVENT 5: 1994 — Surat Plague ═══ -->
  <line x1="564" y1="238" x2="564" y2="298" stroke="#8B0000" stroke-width="1.8"/>
  <circle cx="564" cy="238" r="6" fill="#cc2200" stroke="#8B0000" stroke-width="1.5"/>
  <rect x="512" y="298" width="106" height="68" fill="#ffe8e8" stroke="#8B0000" stroke-width="1.5" rx="2"/>
  <text x="565" y="314" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8B0000">1994</text>
  <text x="565" y="328" font-size="7.5" text-anchor="middle" fill="#5a0000">Surat pneumonic</text>
  <text x="565" y="340" font-size="7.5" text-anchor="middle" fill="#5a0000">plague. 300,000</text>
  <text x="565" y="352" font-size="7.5" text-anchor="middle" fill="#5a0000">flee city. Mass</text>
  <text x="565" y="362" font-size="7.5" text-anchor="middle" fill="#5a0000">cremation activity</text>

  <!-- ═══ EVENT 6: ~2000s — "India's most haunted beach" ═══ -->
  <line x1="638" y1="238" x2="638" y2="148" stroke="#c97a5a" stroke-width="1.5"/>
  <circle cx="638" cy="238" r="5" fill="#c97a5a" stroke="#9a5a3a" stroke-width="1.2"/>
  <rect x="584" y="76" width="110" height="72" fill="#fff" stroke="#c97a5a" stroke-width="1" rx="2"/>
  <text x="639" y="92" font-size="9" font-weight="bold" text-anchor="middle" fill="#c97a5a">2000s</text>
  <text x="639" y="106" font-size="7.5" text-anchor="middle" fill="#1a1a1a">"India's Most</text>
  <text x="639" y="118" font-size="7.5" text-anchor="middle" fill="#1a1a1a">Haunted Beach"</text>
  <text x="639" y="130" font-size="7.5" text-anchor="middle" fill="#1a1a1a">reputation in</text>
  <text x="639" y="142" font-size="7.5" font-style="italic" text-anchor="middle" fill="#c97a5a">national media</text>

  <!-- ═══ EVENT 7: 2010s+ — Paranormal TV + day tourism boom ═══ -->
  <line x1="718" y1="238" x2="718" y2="298" stroke="#c97a5a" stroke-width="1.5"/>
  <circle cx="718" cy="238" r="5" fill="#c97a5a" stroke="#9a5a3a" stroke-width="1.2"/>
  <rect x="668" y="298" width="104" height="68" fill="#fff" stroke="#c97a5a" stroke-width="1" rx="2"/>
  <text x="720" y="314" font-size="9" font-weight="bold" text-anchor="middle" fill="#c97a5a">2010s+</text>
  <text x="720" y="328" font-size="7.5" text-anchor="middle" fill="#1a1a1a">Paranormal TV</text>
  <text x="720" y="340" font-size="7.5" text-anchor="middle" fill="#1a1a1a">shows · day tourism</text>
  <text x="720" y="352" font-size="7.5" text-anchor="middle" fill="#1a1a1a">by families /</text>
  <text x="720" y="364" font-size="7.5" font-style="italic" text-anchor="middle" fill="#c97a5a">haunted by night</text>

  <!-- Year labels -->
  <text x="88" y="255" font-size="7.5" text-anchor="middle" fill="#555">1600s</text>
  <text x="298" y="255" font-size="7.5" text-anchor="middle" fill="#555">1837</text>
  <text x="480" y="255" font-size="7.5" text-anchor="middle" fill="#555">1970s</text>
  <text x="564" y="255" font-size="7.5" text-anchor="middle" fill="#555">1994</text>
  <text x="638" y="255" font-size="7.5" text-anchor="middle" fill="#555">2000s</text>
  <text x="718" y="255" font-size="7.5" text-anchor="middle" fill="#555">2010s+</text>

  <!-- Author note box -->
  <g transform="translate(54, 400)">
    <rect x="0" y="0" width="692" height="82" fill="#fff" stroke="#3a2a20" stroke-width="1.2"/>
    <text x="346" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">FOR THE AUTHOR — A SITE HAUNTED BY ITS FUNCTION</text>
    <text x="346" y="36" font-size="9" text-anchor="middle" fill="#1a1a1a">
      Unlike most haunted sites in India, Dumas Beach was not the site of a historical trauma — it WAS the site of recurring, intended death rites for centuries.
    </text>
    <text x="346" y="52" font-size="9" text-anchor="middle" fill="#1a1a1a">
      The cremation ground was not accidental to the beach; it was the beach's purpose. The black sand, the smell of the sea, the sound of waves — all context for the act of releasing the dead.
    </text>
    <text x="346" y="68" font-size="9" font-style="italic" text-anchor="middle" fill="#8B0000">
      The haunting is not a deviation from the site's history. The haunting IS the history, made visible.
    </text>
  </g>

  <text x="400" y="500" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Dates marked c. are approximate; cremation ground records are incomplete
  </text>
</svg>
