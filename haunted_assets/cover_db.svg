<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <linearGradient id="skyDB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020208"/>
      <stop offset="50%" stop-color="#06081a"/>
      <stop offset="100%" stop-color="#0a0e24"/>
    </linearGradient>
    <linearGradient id="seaDB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>
    <linearGradient id="sandDB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#1e1a14"/>
    </linearGradient>
    <linearGradient id="moonpathDB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8b860" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d8c878" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c8b860" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyDB)"/>

  <!-- Stars -->
  <g fill="#e0dcc0" opacity="0.55">
    <circle cx="50" cy="25" r="1.0"/><circle cx="120" cy="15" r="0.7"/><circle cx="200" cy="32" r="1.2"/>
    <circle cx="280" cy="10" r="0.6"/><circle cx="360" cy="22" r="1.0"/><circle cx="440" cy="8" r="0.8"/>
    <circle cx="520" cy="28" r="1.1"/><circle cx="600" cy="14" r="0.7"/><circle cx="680" cy="32" r="1.3"/>
    <circle cx="740" cy="18" r="0.8"/><circle cx="88" cy="58" r="0.8"/><circle cx="168" cy="68" r="1.1"/>
    <circle cx="310" cy="55" r="0.6"/><circle cx="430" cy="62" r="0.9"/><circle cx="560" cy="48" r="0.7"/>
    <circle cx="650" cy="65" r="1.0"/><circle cx="760" cy="52" r="0.8"/><circle cx="32" cy="80" r="0.9"/>
    <circle cx="490" cy="42" r="0.6"/><circle cx="710" cy="80" r="1.1"/>
  </g>

  <!-- Moon — full, high in sky -->
  <circle cx="660" cy="70" r="45" fill="#e8d870" opacity="0.85"/>
  <circle cx="660" cy="70" r="45" fill="none" stroke="#e8d870" stroke-width="2" opacity="0.2"/>
  <!-- Moon surface detail (subtle) -->
  <circle cx="648" cy="60" r="8" fill="#d8c858" opacity="0.3"/>
  <circle cx="670" cy="82" r="5" fill="#d8c858" opacity="0.2"/>

  <!-- Arabian Sea -->
  <rect x="0" y="228" width="800" height="170" fill="url(#seaDB)"/>

  <!-- Moonpath on water -->
  <ellipse cx="400" cy="300" rx="260" ry="30" fill="url(#moonpathDB)"/>
  <ellipse cx="400" cy="280" rx="180" ry="18" fill="url(#moonpathDB)" opacity="0.5"/>

  <!-- Wave lines on sea -->
  <g fill="none" stroke="#a8b8d8" stroke-width="0.8" opacity="0.25">
    <path d="M 0,250 Q 80,244 160,250 Q 240,256 320,250 Q 400,244 480,250 Q 560,256 640,250 Q 720,244 800,250"/>
    <path d="M 0,268 Q 80,262 160,268 Q 240,274 320,268 Q 400,262 480,268 Q 560,274 640,268 Q 720,262 800,268"/>
    <path d="M 0,288 Q 100,282 200,288 Q 300,294 400,288 Q 500,282 600,288 Q 700,294 800,288"/>
    <path d="M 0,310 Q 100,304 200,310 Q 300,316 400,310 Q 500,304 600,310 Q 700,316 800,310"/>
    <path d="M 0,334 Q 100,328 200,334 Q 300,340 400,334 Q 500,328 600,334 Q 700,340 800,334"/>
    <path d="M 0,358 Q 80,352 160,358 Q 240,364 320,358 Q 400,352 480,358 Q 560,364 640,358 Q 720,352 800,358"/>
  </g>

  <!-- Breaking waves at shoreline -->
  <path d="M 0,396 Q 100,390 200,396 Q 300,402 400,396 Q 500,390 600,396 Q 700,402 800,396"
        fill="#d8e8f8" opacity="0.18"/>
  <path d="M 0,400 Q 80,394 160,400 Q 320,408 480,400 Q 640,394 800,400"
        fill="#e8f0ff" opacity="0.12"/>

  <!-- Black sand beach -->
  <rect x="0" y="398" width="800" height="102" fill="url(#sandDB)"/>

  <!-- Sand texture (subtle grain lines) -->
  <g stroke="#252018" stroke-width="0.6" opacity="0.4">
    <path d="M 20,420 Q 80,418 160,420 Q 240,422 320,420 Q 400,418 480,420"/>
    <path d="M 0,435 Q 100,432 200,435 Q 300,438 400,435 Q 500,432 600,435 Q 700,438 800,435"/>
    <path d="M 50,452 Q 160,448 280,452 Q 400,456 520,452 Q 640,448 760,452"/>
    <path d="M 0,470 Q 120,466 240,470 Q 360,474 480,470 Q 600,466 720,470"/>
  </g>

  <!-- Wet sand reflection at shoreline -->
  <rect x="0" y="398" width="800" height="12" fill="#2a3040" opacity="0.5"/>

  <!-- Silhouettes: 3 stray dogs on the beach (iconic Dumas element) -->
  <!-- Dog 1 (left, standing, facing sea) -->
  <g transform="translate(140, 438)" fill="#080808" opacity="0.85">
    <ellipse cx="0" cy="0" rx="20" ry="8"/>
    <circle cx="18" cy="-6" r="7"/>
    <line x1="-12" y1="5" x2="-14" y2="18" stroke="#080808" stroke-width="3"/>
    <line x1="-4" y1="7" x2="-4" y2="18" stroke="#080808" stroke-width="3"/>
    <line x1="8" y1="7" x2="8" y2="18" stroke="#080808" stroke-width="3"/>
    <line x1="16" y1="5" x2="18" y2="18" stroke="#080808" stroke-width="3"/>
    <line x1="-20" y1="-2" x2="-32" y2="2" stroke="#080808" stroke-width="3"/>
  </g>

  <!-- Dog 2 (center-left, sitting, head up — barking into air) -->
  <g transform="translate(320, 440)" fill="#080808" opacity="0.85">
    <ellipse cx="0" cy="5" rx="12" ry="10"/>
    <circle cx="8" cy="-8" r="8"/>
    <line x1="-6" y1="12" x2="-8" y2="22" stroke="#080808" stroke-width="3"/>
    <line x1="4" y1="14" x2="4" y2="24" stroke="#080808" stroke-width="3"/>
    <line x1="14" y1="8" x2="24" y2="8" stroke="#080808" stroke-width="2"/>
  </g>

  <!-- Dog 3 (right, facing away from sea — barking into the dark inland) -->
  <g transform="translate(580, 444)" fill="#080808" opacity="0.9">
    <ellipse cx="0" cy="0" rx="18" ry="7"/>
    <circle cx="-16" cy="-5" r="6"/>
    <line x1="-10" y1="5" x2="-12" y2="16" stroke="#080808" stroke-width="2.5"/>
    <line x1="-2" y1="6" x2="-2" y2="16" stroke="#080808" stroke-width="2.5"/>
    <line x1="8" y1="6" x2="8" y2="16" stroke="#080808" stroke-width="2.5"/>
    <line x1="16" y1="4" x2="18" y2="16" stroke="#080808" stroke-width="2.5"/>
    <line x1="18" y1="-2" x2="30" y2="-5" stroke="#080808" stroke-width="2.5"/>
  </g>

  <!-- Distant light (temple / food stall warm glow in far distance) -->
  <circle cx="720" cy="405" r="4" fill="#e8c040" opacity="0.6"/>
  <ellipse cx="720" cy="408" rx="8" ry="3" fill="#e8c040" opacity="0.15"/>
  <text x="736" y="409" font-size="7.5" fill="#c8a020" opacity="0.7" font-style="italic">Hanuman temple</text>

  <!-- Title area -->
  <rect x="0" y="0" width="800" height="108" fill="#020208" opacity="0.65"/>
  <text x="400" y="42" font-size="36" font-weight="bold" text-anchor="middle" fill="#8B0000" letter-spacing="5">DUMAS BEACH</text>
  <text x="400" y="66" font-size="13" font-style="italic" text-anchor="middle" fill="#c8a878" letter-spacing="1">India's Most Haunted Shore · Black Sand · Arabian Sea · Surat, Gujarat</text>
  <text x="400" y="86" font-size="9.5" text-anchor="middle" fill="#888">FORMER CREMATION GROUND · ACTIVE HINDU PILGRIMAGE · FAMILY BEACH BY DAY · HAUNTED BY NIGHT</text>

  <!-- Bottom caption band -->
  <rect x="0" y="460" width="800" height="40" fill="#020208" opacity="0.7"/>
  <text x="400" y="475" font-size="9" text-anchor="middle" fill="#aaaaaa">GULF OF KHAMBHAT · DANGEROUS TIDAL CURRENTS · "DO NOT ANSWER IF YOUR NAME IS CALLED"</text>
  <text x="400" y="491" font-size="7.5" font-style="italic" text-anchor="middle" fill="#666">
    The dogs bark all night. They are barking at something. They have always been barking.
  </text>
</svg>
