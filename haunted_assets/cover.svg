<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="45%" stop-color="#1a0e2a"/>
      <stop offset="80%" stop-color="#2a1a3a"/>
      <stop offset="100%" stop-color="#1a0a1a"/>
    </linearGradient>
    <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8c0"/>
      <stop offset="70%" stop-color="#e8c888"/>
      <stop offset="100%" stop-color="#c8a060"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1010"/>
      <stop offset="100%" stop-color="#0d0808"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#e8d8b0" opacity="0.6">
    <circle cx="60" cy="40" r="0.9"/><circle cx="130" cy="60" r="0.7"/>
    <circle cx="210" cy="35" r="1.1"/><circle cx="285" cy="75" r="0.6"/>
    <circle cx="350" cy="42" r="0.8"/><circle cx="430" cy="28" r="1.0"/>
    <circle cx="500" cy="65" r="0.7"/><circle cx="560" cy="38" r="0.9"/>
    <circle cx="700" cy="55" r="0.8"/><circle cx="750" cy="85" r="0.6"/>
    <circle cx="110" cy="110" r="0.5"/><circle cx="200" cy="120" r="0.7"/>
    <circle cx="320" cy="100" r="0.5"/><circle cx="470" cy="115" r="0.6"/>
    <circle cx="620" cy="95" r="0.8"/><circle cx="760" cy="130" r="0.5"/>
    <circle cx="80" cy="160" r="0.6"/><circle cx="400" cy="145" r="0.5"/>
  </g>

  <!-- Moon -->
  <circle cx="660" cy="100" r="52" fill="url(#moonGrad)" opacity="0.92"/>
  <circle cx="660" cy="100" r="72" fill="none" stroke="#ffe8c0" stroke-width="0.8" opacity="0.12"/>
  <circle cx="660" cy="100" r="95" fill="none" stroke="#ffe8c0" stroke-width="0.5" opacity="0.06"/>

  <!-- Far silhouette ridge -->
  <path d="M 0,310 Q 80,295 150,305 Q 250,290 340,300 Q 430,285 520,300 Q 620,290 700,305 Q 750,300 800,295 L 800,500 L 0,500 Z"
        fill="#0d0808" opacity="0.5"/>

  <!-- Ten silhouettes (simplified) from left to right -->
  <!-- 1. Fort tower (Bhangarh style) -->
  <g transform="translate(40, 320)">
    <rect x="10" y="-80" width="18" height="80" fill="#0a0606"/>
    <polygon points="10,-80 19,-95 28,-80" fill="#0a0606"/>
    <rect x="0" y="-50" width="38" height="50" fill="#0a0606"/>
    <rect x="3" y="-40" width="6" height="10" fill="#1a0e1e" opacity="0.4"/>
    <rect x="29" y="-40" width="6" height="10" fill="#1a0e1e" opacity="0.4"/>
  </g>

  <!-- 2. Village hut ruins (Kuldhara) -->
  <g transform="translate(110, 330)">
    <rect x="0" y="-35" width="30" height="35" fill="#0a0606"/>
    <polygon points="0,-35 15,-55 30,-35" fill="#0a0606"/>
    <rect x="25" y="-25" width="20" height="25" fill="#0a0606"/>
    <polygon points="25,-25 35,-38 45,-25" fill="#0a0606"/>
  </g>

  <!-- 3. Beach waves (Dumas) -->
  <g transform="translate(180, 340)">
    <path d="M0,0 Q10,-12 20,0 Q30,-12 40,0 Q50,-12 60,0" fill="none" stroke="#2a4060" stroke-width="3"/>
    <path d="M0,8 Q10,-4 20,8 Q30,-4 40,8" fill="none" stroke="#2a4060" stroke-width="2"/>
  </g>

  <!-- 4. Steep hill + school (Dow Hill) -->
  <g transform="translate(260, 320)">
    <polygon points="0,60 30,-40 60,60" fill="#0a0606"/>
    <rect x="15" y="-10" width="32" height="20" fill="#0d0a10"/>
    <rect x="22" y="-15" width="18" height="6" fill="#0d0a10"/>
    <rect x="18" y="-5" width="4" height="6" fill="#1a0e24" opacity="0.5"/>
    <rect x="30" y="-5" width="4" height="6" fill="#1a0e24" opacity="0.5"/>
    <rect x="42" y="-5" width="4" height="6" fill="#1a0e24" opacity="0.5"/>
  </g>

  <!-- 5. Peshwa palace (Shaniwarwada) -->
  <g transform="translate(350, 315)">
    <rect x="0" y="-75" width="60" height="75" fill="#0a0606"/>
    <rect x="22" y="-90" width="16" height="25" fill="#0a0606"/>
    <polygon points="22,-90 30,-102 38,-90" fill="#0a0606"/>
    <rect x="5" y="-55" width="8" height="12" fill="#1a0e1e" opacity="0.4"/>
    <rect x="47" y="-55" width="8" height="12" fill="#1a0e1e" opacity="0.4"/>
    <rect x="26" y="-55" width="8" height="12" fill="#1a0e1e" opacity="0.4"/>
    <rect x="15" y="-30" width="30" height="30" fill="#1a0e1e" opacity="0.3"/>
  </g>

  <!-- 6. Stepped baoli (Agrasen ki Baoli) -->
  <g transform="translate(430, 330)">
    <rect x="0" y="-50" width="50" height="50" fill="#0a0606"/>
    <line x1="5" y1="-40" x2="45" y2="-40" stroke="#1a0e1e" stroke-width="2"/>
    <line x1="8" y1="-30" x2="42" y2="-30" stroke="#1a0e1e" stroke-width="2"/>
    <line x1="12" y1="-20" x2="38" y2="-20" stroke="#1a0e1e" stroke-width="2"/>
    <line x1="16" y1="-10" x2="34" y2="-10" stroke="#1a0e1e" stroke-width="2"/>
  </g>

  <!-- 7. Mosque dome (Jamali Kamali) -->
  <g transform="translate(505, 315)">
    <rect x="0" y="-55" width="50" height="55" fill="#0a0606"/>
    <ellipse cx="25" cy="-55" rx="18" ry="22" fill="#0a0606"/>
    <rect x="5" y="-90" width="6" height="28" fill="#0a0606"/>
    <rect x="39" y="-90" width="6" height="28" fill="#0a0606"/>
    <rect x="5" y="-35" width="8" height="14" fill="#1a0e1e" opacity="0.4"/>
    <rect x="37" y="-35" width="8" height="14" fill="#1a0e1e" opacity="0.4"/>
  </g>

  <!-- 8. Palace hotel (Brij Raj Bhavan) -->
  <g transform="translate(580, 312)">
    <rect x="0" y="-70" width="65" height="70" fill="#0a0606"/>
    <rect x="10" y="-85" width="45" height="20" fill="#0a0606"/>
    <rect x="28" y="-100" width="10" height="18" fill="#0a0606"/>
    <rect x="5" y="-55" width="8" height="14" fill="#1a0e1e" opacity="0.4"/>
    <rect x="28" y="-55" width="8" height="14" fill="#1a0e1e" opacity="0.4"/>
    <rect x="52" y="-55" width="8" height="14" fill="#1a0e1e" opacity="0.4"/>
  </g>

  <!-- 9. Colonial hotel gabled (Savoy) -->
  <g transform="translate(668, 315)">
    <rect x="0" y="-65" width="55" height="65" fill="#0a0606"/>
    <polygon points="0,-65 27,-90 55,-65" fill="#0a0606"/>
    <polygon points="10,-65 27,-82 45,-65" fill="#0a0606"/>
    <rect x="20" y="-55" width="14" height="22" fill="#1a0e1e" opacity="0.4"/>
    <rect x="5" y="-40" width="10" height="12" fill="#1a0e1e" opacity="0.4"/>
    <rect x="40" y="-40" width="10" height="12" fill="#1a0e1e" opacity="0.4"/>
  </g>

  <!-- 10. Colonial bungalow (Fernhill Ooty) -->
  <g transform="translate(745, 320)">
    <rect x="0" y="-55" width="50" height="55" fill="#0a0606"/>
    <polygon points="-4,-55 25,-78 54,-55" fill="#0a0606"/>
    <rect x="18" y="-45" width="14" height="22" fill="#1a0e1e" opacity="0.4"/>
    <rect x="4" y="-30" width="9" height="10" fill="#1a0e1e" opacity="0.4"/>
    <rect x="37" y="-30" width="9" height="10" fill="#1a0e1e" opacity="0.4"/>
  </g>

  <!-- Ground line -->
  <rect x="0" y="370" width="800" height="130" fill="url(#groundGrad)"/>

  <!-- Mist -->
  <g opacity="0.18" fill="#c8d8e0">
    <ellipse cx="200" cy="375" rx="130" ry="7"/>
    <ellipse cx="500" cy="372" rx="160" ry="6"/>
    <ellipse cx="720" cy="378" rx="100" ry="5"/>
  </g>

  <!-- Site number labels -->
  <g font-size="8" fill="#d0c0a0" text-anchor="middle" opacity="0.8">
    <text x="59" y="398">① Bhangarh</text>
    <text x="125" y="398">② Kuldhara</text>
    <text x="205" y="398">③ Dumas</text>
    <text x="293" y="398">④ Dow Hill</text>
    <text x="382" y="398">⑤ Shaniwarwada</text>
    <text x="457" y="398">⑥ Agrasen</text>
    <text x="530" y="398">⑦ Jamali</text>
    <text x="616" y="398">⑧ Brij Raj</text>
    <text x="696" y="398">⑨ Savoy</text>
    <text x="770" y="398">⑩ Fernhill</text>
  </g>

  <!-- Title -->
  <rect x="0" y="420" width="800" height="80" fill="#0a0606" opacity="0.88"/>
  <text x="400" y="448" font-size="11" letter-spacing="4" text-anchor="middle" fill="#c8a060" opacity="0.85">INVESTIGATIVE RESEARCH DOSSIER · MAY 2026</text>
  <text x="400" y="472" font-size="20" letter-spacing="5" text-anchor="middle" fill="#e8d8b0" font-weight="bold">10 HAUNTED PLACES OF INDIA</text>
  <text x="400" y="490" font-size="9" letter-spacing="2" text-anchor="middle" fill="#887060">Historical · Folkloric · Paranormal Research</text>
</svg>
