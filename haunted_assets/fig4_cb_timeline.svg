<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Georgia, serif">
  <rect width="800" height="520" fill="#f9f4ed"/>

  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 4 — HISTORICAL TIMELINE: CHAND BAORI</text>
  <text x="400" y="46" font-size="10" font-style="italic" text-anchor="middle" fill="#666">c. 800 CE to present · Nikumbha dynasty · Ghaznavid raids · colonial survey · modern film fame</text>

  <!-- Timeline spine -->
  <line x1="60" y1="235" x2="748" y2="235" stroke="#5a4030" stroke-width="2.5"/>
  <!-- Arrow head -->
  <polygon points="748,230 762,235 748,240" fill="#5a4030"/>

  <!-- ═══ EVENT 1: c.800 CE — Construction ═══ -->
  <!-- x=80 -->
  <line x1="80" y1="235" x2="80" y2="148" stroke="#8B0000" stroke-width="1.5"/>
  <circle cx="80" cy="235" r="6" fill="#8B0000" stroke="#5a0000" stroke-width="1.5"/>
  <rect x="32" y="82" width="98" height="66" fill="#fff" stroke="#8B0000" stroke-width="1.2" rx="2"/>
  <text x="81" y="98" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8B0000">c. 800 CE</text>
  <text x="81" y="112" font-size="8" text-anchor="middle" fill="#1a1a1a">Chand Baori built</text>
  <text x="81" y="124" font-size="8" text-anchor="middle" fill="#1a1a1a">by King Chanda</text>
  <text x="81" y="136" font-size="8" text-anchor="middle" fill="#1a1a1a">(Nikumbha dynasty)</text>
  <text x="81" y="148" font-size="7.5" font-style="italic" text-anchor="middle" fill="#8B0000">Harshat Mata temple</text>

  <!-- ═══ EVENT 2: c.850 CE — Abhaneri flourishes ═══ -->
  <!-- x=145 -->
  <line x1="145" y1="235" x2="145" y2="292" stroke="#5b8db5" stroke-width="1.5"/>
  <circle cx="145" cy="235" r="5" fill="#5b8db5" stroke="#2a5a9a" stroke-width="1.2"/>
  <rect x="98" y="292" width="94" height="56" fill="#fff" stroke="#5b8db5" stroke-width="1" rx="2"/>
  <text x="145" y="308" font-size="9" font-weight="bold" text-anchor="middle" fill="#2a5a9a">c. 850 CE</text>
  <text x="145" y="322" font-size="7.5" text-anchor="middle" fill="#1a1a1a">Abhaneri a regional</text>
  <text x="145" y="334" font-size="7.5" text-anchor="middle" fill="#1a1a1a">centre; stepwell serves</text>
  <text x="145" y="346" font-size="7.5" text-anchor="middle" fill="#1a1a1a">thousands of villages</text>

  <!-- ═══ EVENT 3: c.1024 CE — Mahmud Ghazni raids ═══ -->
  <!-- x=220 -->
  <line x1="220" y1="235" x2="220" y2="130" stroke="#8B0000" stroke-width="1.8"/>
  <circle cx="220" cy="235" r="6" fill="#cc2200" stroke="#8B0000" stroke-width="1.5"/>
  <rect x="168" y="68" width="104" height="62" fill="#ffe8e8" stroke="#8B0000" stroke-width="1.5" rx="2"/>
  <text x="220" y="84" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8B0000">c. 1024 CE</text>
  <text x="220" y="98" font-size="8" text-anchor="middle" fill="#5a0000">Mahmud of Ghazni</text>
  <text x="220" y="110" font-size="8" text-anchor="middle" fill="#5a0000">raids Abhaneri</text>
  <text x="220" y="122" font-size="8" text-anchor="middle" fill="#5a0000">Harshat Mata temple</text>
  <text x="220" y="130" font-size="8" font-style="italic" text-anchor="middle" fill="#5a0000">partially destroyed</text>

  <!-- ═══ EVENT 4: c.1200 CE — Decline ═══ -->
  <!-- x=285 -->
  <line x1="285" y1="235" x2="285" y2="295" stroke="#888" stroke-width="1.5"/>
  <circle cx="285" cy="235" r="5" fill="#888" stroke="#555" stroke-width="1.2"/>
  <rect x="240" y="295" width="92" height="56" fill="#fff" stroke="#888" stroke-width="1" rx="2"/>
  <text x="286" y="311" font-size="9" font-weight="bold" text-anchor="middle" fill="#555">c. 1200 CE</text>
  <text x="286" y="325" font-size="7.5" text-anchor="middle" fill="#3a3a3a">Nikumbha dynasty</text>
  <text x="286" y="337" font-size="7.5" text-anchor="middle" fill="#3a3a3a">wanes; Abhaneri</text>
  <text x="286" y="349" font-size="7.5" text-anchor="middle" fill="#3a3a3a">loses prominence</text>

  <!-- LONG GAP indicator -->
  <text x="378" y="228" font-size="16" fill="#888" text-anchor="middle" opacity="0.6">· · · · · ·</text>
  <text x="378" y="248" font-size="8" font-style="italic" text-anchor="middle" fill="#888">~600 years of local village use</text>

  <!-- ═══ EVENT 5: 1803 CE — British survey ═══ -->
  <!-- x=470 -->
  <line x1="470" y1="235" x2="470" y2="140" stroke="#5b8db5" stroke-width="1.5"/>
  <circle cx="470" cy="235" r="5" fill="#5b8db5" stroke="#2a5a9a" stroke-width="1.2"/>
  <rect x="420" y="74" width="102" height="66" fill="#fff" stroke="#5b8db5" stroke-width="1" rx="2"/>
  <text x="471" y="90" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#2a5a9a">1803 CE</text>
  <text x="471" y="104" font-size="8" text-anchor="middle" fill="#1a1a1a">Col. Tone &amp; EIC</text>
  <text x="471" y="116" font-size="8" text-anchor="middle" fill="#1a1a1a">surveyors formally</text>
  <text x="471" y="128" font-size="8" text-anchor="middle" fill="#1a1a1a">document the site</text>
  <text x="471" y="140" font-size="7.5" font-style="italic" text-anchor="middle" fill="#2a5a9a">First written records</text>

  <!-- ═══ EVENT 6: 1906 — ASI ═══ -->
  <!-- x=530 -->
  <line x1="530" y1="235" x2="530" y2="295" stroke="#5a8a3a" stroke-width="1.5"/>
  <circle cx="530" cy="235" r="5" fill="#5a8a3a" stroke="#3a6a1a" stroke-width="1.2"/>
  <rect x="480" y="295" width="102" height="56" fill="#fff" stroke="#5a8a3a" stroke-width="1" rx="2"/>
  <text x="531" y="311" font-size="9" font-weight="bold" text-anchor="middle" fill="#3a6a1a">1906</text>
  <text x="531" y="325" font-size="7.5" text-anchor="middle" fill="#1a1a1a">Archaeological Survey</text>
  <text x="531" y="337" font-size="7.5" text-anchor="middle" fill="#1a1a1a">of India (ASI) takes</text>
  <text x="531" y="349" font-size="7.5" text-anchor="middle" fill="#1a1a1a">formal responsibility</text>

  <!-- ═══ EVENT 7: 2005 — Paheli ═══ -->
  <!-- x=590 -->
  <line x1="590" y1="235" x2="590" y2="148" stroke="#c97a5a" stroke-width="1.5"/>
  <circle cx="590" cy="235" r="5" fill="#c97a5a" stroke="#9a5a3a" stroke-width="1.2"/>
  <rect x="540" y="80" width="100" height="68" fill="#fff" stroke="#c97a5a" stroke-width="1" rx="2"/>
  <text x="590" y="96" font-size="9" font-weight="bold" text-anchor="middle" fill="#c97a5a">2005</text>
  <text x="590" y="110" font-size="8" text-anchor="middle" fill="#1a1a1a">Paheli (Bollywood)</text>
  <text x="590" y="122" font-size="8" text-anchor="middle" fill="#1a1a1a">filmed here</text>
  <text x="590" y="134" font-size="7.5" text-anchor="middle" fill="#1a1a1a">(SRK, Rani Mukerji</text>
  <text x="590" y="146" font-size="7.5" font-style="italic" text-anchor="middle" fill="#c97a5a">ghost love story)</text>

  <!-- ═══ EVENT 8: 2006 — The Fall ═══ -->
  <!-- x=628 -->
  <line x1="630" y1="235" x2="630" y2="300" stroke="#c97a5a" stroke-width="1.5"/>
  <circle cx="630" cy="235" r="4" fill="#c97a5a" stroke="#9a5a3a" stroke-width="1.2"/>
  <rect x="584" y="300" width="96" height="44" fill="#fff" stroke="#c97a5a" stroke-width="1" rx="2"/>
  <text x="632" y="314" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#c97a5a">2006</text>
  <text x="632" y="326" font-size="7.5" text-anchor="middle" fill="#1a1a1a">The Fall (Tarsem Singh)</text>
  <text x="632" y="340" font-size="7" text-anchor="middle" fill="#1a1a1a">Iconic visual sequences</text>

  <!-- ═══ EVENT 9: 2012 — Dark Knight Rises ═══ -->
  <!-- x=690 -->
  <line x1="690" y1="235" x2="690" y2="142" stroke="#8B0000" stroke-width="1.8"/>
  <circle cx="690" cy="235" r="6" fill="#8B0000" stroke="#5a0000" stroke-width="1.5"/>
  <rect x="636" y="68" width="108" height="74" fill="#ffe8e8" stroke="#8B0000" stroke-width="1.5" rx="2"/>
  <text x="690" y="84" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#8B0000">2012</text>
  <text x="690" y="98" font-size="8" text-anchor="middle" fill="#5a0000">The Dark Knight</text>
  <text x="690" y="110" font-size="8" text-anchor="middle" fill="#5a0000">Rises (Nolan)</text>
  <text x="690" y="122" font-size="8" text-anchor="middle" fill="#5a0000">Prison-pit scenes</text>
  <text x="690" y="134" font-size="7.5" font-style="italic" text-anchor="middle" fill="#5a0000">Bruce Wayne's</text>
  <text x="690" y="142" font-size="7.5" font-style="italic" text-anchor="middle" fill="#5a0000">descent / escape</text>

  <!-- Year labels on spine -->
  <text x="80" y="252" font-size="7.5" text-anchor="middle" fill="#555">800</text>
  <text x="220" y="252" font-size="7.5" text-anchor="middle" fill="#555">1024</text>
  <text x="285" y="252" font-size="7.5" text-anchor="middle" fill="#555">1200</text>
  <text x="470" y="252" font-size="7.5" text-anchor="middle" fill="#555">1803</text>
  <text x="530" y="252" font-size="7.5" text-anchor="middle" fill="#555">1906</text>
  <text x="590" y="252" font-size="7.5" text-anchor="middle" fill="#555">2005</text>
  <text x="690" y="252" font-size="7.5" text-anchor="middle" fill="#555">2012</text>

  <!-- Author note box -->
  <g transform="translate(54, 400)">
    <rect x="0" y="0" width="692" height="80" fill="#fff" stroke="#3a2a20" stroke-width="1.2"/>
    <text x="346" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">FOR THE AUTHOR — THE DUAL TIMELINE</text>
    <text x="346" y="36" font-size="9" text-anchor="middle" fill="#1a1a1a">
      Chand Baori has TWO separate histories: its ancient Rajput origins (8th century CE) and its modern pop-culture resurgence (2005–2012).
    </text>
    <text x="346" y="52" font-size="9" text-anchor="middle" fill="#1a1a1a">
      The "prison pit" from The Dark Knight Rises is one of the most recognisable locations in recent cinema. Visitors arrive knowing the film.
    </text>
    <text x="346" y="68" font-size="9" font-style="italic" text-anchor="middle" fill="#8B0000">
      The ancient and the cinematic collapse into one: every tourist photographs what Nolan framed. The original mystery is behind that image.
    </text>
  </g>

  <text x="400" y="498" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Dates marked c. are approximate; exact construction year is unrecorded
  </text>
</svg>
