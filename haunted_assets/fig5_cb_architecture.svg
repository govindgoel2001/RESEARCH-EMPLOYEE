<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Georgia, serif">
  <rect width="800" height="540" fill="#f9f4ed"/>

  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 5 — ARCHITECTURE: CHAND BAORI STEPWELL</text>
  <text x="400" y="46" font-size="10" font-style="italic" text-anchor="middle" fill="#666">Plan view (left) · Cross-section showing 13 floors (right) · 4 floors submerged in water table</text>

  <!-- ═══ LEFT: Top-down plan view ═══ -->
  <rect x="30" y="62" width="345" height="250" fill="#e8e0d0" stroke="#5a4030" stroke-width="1.2" rx="1"/>
  <text x="202" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">PLAN VIEW — FROM ABOVE</text>

  <!-- Outer boundary (ground level) -->
  <rect x="70" y="92" width="265" height="200" fill="#d4c4a8" stroke="#5a3a20" stroke-width="2"/>

  <!-- Stepped tiers (represented as inset lines showing the descending platforms) -->
  <!-- Each inner rect represents one tier going down -->
  <rect x="88" y="108" width="229" height="168" fill="#c8b898" stroke="#8a6a40" stroke-width="0.8"/>
  <rect x="106" y="124" width="193" height="136" fill="#bcaa88" stroke="#8a6a40" stroke-width="0.8"/>
  <rect x="124" y="140" width="157" height="104" fill="#b09878" stroke="#8a6a40" stroke-width="0.8"/>
  <rect x="142" y="156" width="121" height="72" fill="#a48868" stroke="#8a6a40" stroke-width="0.8"/>
  <rect x="160" y="172" width="85" height="40" fill="#987858" stroke="#8a6a40" stroke-width="0.8"/>
  <!-- Central water shaft -->
  <rect x="172" y="184" width="61" height="22" fill="#5b8db5" stroke="#2a5a7a" stroke-width="1.5"/>
  <text x="202" y="198" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#fff">WELL</text>

  <!-- Pavilion indicator (north side — top of the plan) -->
  <!-- Represented as a thicker border on the top edge -->
  <rect x="70" y="92" width="265" height="18" fill="#d4a860" stroke="#8a5a20" stroke-width="1.5" opacity="0.8"/>
  <text x="202" y="106" font-size="8" font-weight="bold" text-anchor="middle" fill="#5a2010">PAVILION WALL (North) — ornate 3-storey façade</text>

  <!-- Diagonal step lines to show zigzag pattern (characteristic) -->
  <g stroke="#8a7050" stroke-width="0.6" opacity="0.5">
    <!-- Left face diagonal steps -->
    <line x1="70" y1="110" x2="88" y2="124"/><line x1="70" y1="128" x2="88" y2="142"/>
    <line x1="70" y1="146" x2="88" y2="160"/><line x1="70" y1="164" x2="88" y2="178"/>
    <line x1="70" y1="182" x2="88" y2="196"/><line x1="70" y1="200" x2="88" y2="214"/>
    <line x1="70" y1="218" x2="88" y2="232"/><line x1="70" y1="236" x2="88" y2="250"/>
    <!-- Bottom face diagonal steps -->
    <line x1="88" y1="276" x2="106" y2="260"/><line x1="106" y1="276" x2="124" y2="260"/>
    <line x1="124" y1="276" x2="142" y2="260"/><line x1="142" y1="276" x2="160" y2="260"/>
    <line x1="160" y1="276" x2="178" y2="260"/><line x1="198" y1="276" x2="216" y2="260"/>
    <line x1="216" y1="276" x2="234" y2="260"/><line x1="234" y1="276" x2="252" y2="260"/>
    <line x1="252" y1="276" x2="270" y2="260"/><line x1="270" y1="276" x2="288" y2="260"/>
    <!-- Right face -->
    <line x1="335" y1="110" x2="317" y2="124"/><line x1="335" y1="128" x2="317" y2="142"/>
    <line x1="335" y1="146" x2="317" y2="160"/><line x1="335" y1="164" x2="317" y2="178"/>
    <line x1="335" y1="182" x2="317" y2="196"/><line x1="335" y1="200" x2="317" y2="214"/>
    <line x1="335" y1="218" x2="317" y2="232"/><line x1="335" y1="236" x2="317" y2="250"/>
  </g>

  <!-- Labels -->
  <line x1="38" y1="195" x2="68" y2="195" stroke="#5a4030" stroke-width="0.8"/>
  <text x="36" y="193" font-size="7.5" text-anchor="end" fill="#5a3020">3 sides:</text>
  <text x="36" y="204" font-size="7.5" text-anchor="end" fill="#5a3020">stepped tiers</text>

  <line x1="202" y1="184" x2="202" y2="165" stroke="#2a5a7a" stroke-width="0.8"/>
  <text x="202" y="162" font-size="7.5" text-anchor="middle" fill="#2a5a7a">Water shaft</text>

  <text x="60" y="310" font-size="8" fill="#888" font-style="italic">Not to scale — schematic plan only</text>

  <!-- ═══ RIGHT: Cross-section ═══ -->
  <rect x="398" y="62" width="375" height="250" fill="#dce8f0" stroke="#2a5a7a" stroke-width="1.5" rx="1"/>
  <text x="585" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="#2a5a7a">CROSS-SECTION — NORTH FACE</text>

  <!-- Ground surface line -->
  <line x1="398" y1="110" x2="773" y2="110" stroke="#8a7050" stroke-width="2"/>
  <text x="770" y="107" font-size="8" font-weight="bold" text-anchor="end" fill="#5a4030">GROUND LEVEL</text>

  <!-- PAVILION (left/north side in cross-section) — 3 storey ornate structure -->
  <rect x="412" y="68" width="60" height="42" fill="#d4a860" stroke="#8a5a20" stroke-width="1.5"/>
  <!-- Pavilion windows/arches -->
  <path d="M 420,80 Q 424,75 428,80 L 428,90 L 420,90 Z" fill="#8a5a20" opacity="0.5"/>
  <path d="M 434,80 Q 438,75 442,80 L 442,90 L 434,90 Z" fill="#8a5a20" opacity="0.5"/>
  <path d="M 448,80 Q 452,75 456,80 L 456,90 L 448,90 Z" fill="#8a5a20" opacity="0.5"/>
  <!-- Pavilion label -->
  <text x="442" y="64" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#8a5a20">PAVILION</text>
  <text x="442" y="74" font-size="7.5" text-anchor="middle" fill="#5a3010">(3 storeys)</text>

  <!-- LEFT STEPPED WALL (pavilion side) — 13 tiers going down -->
  <!-- Each tier: 2px step horizontal, 10px step vertical, 13 steps = 130px depth from 110 to 240 -->
  <polygon points="
    412,110  472,110
    472,120  470,120
    470,130  468,130
    468,140  466,140
    466,150  464,150
    464,160  462,160
    462,170  460,170
    460,180  458,180
    458,190  456,190
    456,200  454,200
    454,210  452,210
    452,220  450,220
    450,230  448,230
    448,240
    412,240"
    fill="#d4a860" stroke="#8a5a20" stroke-width="1"/>

  <!-- RIGHT STEPPED WALL (3 sides) — 13 tiers -->
  <polygon points="
    760,110  700,110
    700,120  702,120
    702,130  704,130
    704,140  706,140
    706,150  708,150
    708,160  710,160
    710,170  712,170
    712,180  714,180
    714,190  716,190
    716,200  718,200
    718,210  720,210
    720,220  722,220
    722,230  724,230
    724,240
    760,240"
    fill="#c8b898" stroke="#8a6040" stroke-width="1"/>

  <!-- Water level line -->
  <line x1="398" y1="205" x2="773" y2="205" stroke="#5b8db5" stroke-width="2.5"/>
  <text x="770" y="202" font-size="8.5" font-weight="bold" text-anchor="end" fill="#2a5a7a">WATER TABLE</text>

  <!-- Water fill below water table -->
  <rect x="450" y="205" width="272" height="35" fill="#5b8db5" opacity="0.25"/>

  <!-- Well shaft (the actual narrow water column) -->
  <rect x="530" y="110" width="112" height="130" fill="none" stroke="#2a5a7a" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Water at bottom of well -->
  <rect x="530" y="230" width="112" height="18" fill="#5b8db5" opacity="0.55"/>
  <text x="586" y="243" font-size="7.5" text-anchor="middle" fill="#fff">WATER</text>

  <!-- Lakebed / foundation -->
  <rect x="412" y="240" width="348" height="14" fill="#7a6050" stroke="#5a4030" stroke-width="1"/>
  <text x="586" y="251" font-size="7" text-anchor="middle" fill="#fff">lakebed / hard-rock foundation</text>

  <!-- Floor labels (right side) -->
  <text x="772" y="118" font-size="7.5" text-anchor="start" fill="#5a4030">Floor 13 (top)</text>
  <text x="772" y="138" font-size="7.5" text-anchor="start" fill="#5a4030">Floor 12</text>
  <text x="772" y="158" font-size="7.5" text-anchor="start" fill="#5a4030">Floor 11</text>
  <text x="772" y="178" font-size="7.5" text-anchor="start" fill="#5a4030">Floor 10</text>

  <!-- Dimension arrows -->
  <!-- Above water -->
  <line x1="420" y1="110" x2="420" y2="205" stroke="#8B0000" stroke-width="1.5"/>
  <polygon points="420,110 416,122 424,122" fill="#8B0000"/>
  <polygon points="420,205 416,193 424,193" fill="#8B0000"/>
  <text x="410" y="158" font-size="8" text-anchor="end" fill="#8B0000">~9 m</text>
  <text x="410" y="170" font-size="7.5" text-anchor="end" fill="#8B0000">above</text>
  <text x="410" y="181" font-size="7.5" text-anchor="end" fill="#8B0000">water</text>

  <!-- Below water -->
  <line x1="420" y1="205" x2="420" y2="240" stroke="#2a5a7a" stroke-width="1.5"/>
  <polygon points="420,205 416,217 424,217" fill="#2a5a7a"/>
  <polygon points="420,240 416,228 424,228" fill="#2a5a7a"/>
  <text x="410" y="222" font-size="8" text-anchor="end" fill="#2a5a7a">~21 m</text>
  <text x="410" y="234" font-size="7.5" text-anchor="end" fill="#2a5a7a">below</text>

  <!-- Total depth annotation -->
  <text x="585" y="268" font-size="9" font-weight="bold" text-anchor="middle" fill="#2a5a7a">TOTAL DEPTH: ~30 m · 13 FLOORS · ~3,500 STEPS</text>

  <!-- ═══ BOTTOM: Author note ═══ -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="743" height="92" fill="#fff" stroke="#3a2a20" stroke-width="1.2"/>
    <text x="371" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">FOR THE AUTHOR — THE ARCHITECTURAL PARADOX</text>
    <text x="371" y="36" font-size="9" text-anchor="middle" fill="#1a1a1a">
      Chand Baori was designed so that the LOWER you go, the COOLER it gets. The bottom is 5–6°C cooler than the surface — a natural desert refuge.
    </text>
    <text x="371" y="52" font-size="9" text-anchor="middle" fill="#1a1a1a">
      The 3,500 steps are arranged in a precise geometric zigzag pattern. Going DOWN is easy. Going UP — due to the narrow, steep risers — is extremely difficult.
    </text>
    <text x="371" y="68" font-size="9" text-anchor="middle" fill="#1a1a1a">
      The pavilion wall contains sculptures of deities, apsaras, and erotic carvings (similar to Khajuraho tradition). Some are now held in the adjacent temple museum.
    </text>
    <text x="371" y="84" font-size="9" font-style="italic" text-anchor="middle" fill="#8B0000">
      Visitors are NOT permitted to descend. The restriction is ASI policy. The lower levels are visible only from the rim — but not touchable.
    </text>
  </g>

  <text x="400" y="535" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Proportions illustrative; exact floor heights from available archaeological survey estimates
  </text>
</svg>
