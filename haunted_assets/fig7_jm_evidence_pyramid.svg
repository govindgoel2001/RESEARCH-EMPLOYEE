<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#f9f4ed"/>

  <text x="400" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 7 — EVIDENCE PYRAMID: JAL MAHAL</text>
  <text x="400" y="48" font-size="11" font-style="italic" text-anchor="middle" fill="#666">What is verified · documented · inferred · folklore · speculation</text>

  <!-- Tier 1: VERIFIED (top, narrow) -->
  <polygon points="352,78 448,78 468,118 332,118" fill="#2c5a2c" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="400" y="103" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">VERIFIED</text>

  <!-- Tier 2: DOCUMENTED -->
  <polygon points="332,122 468,122 492,164 308,164" fill="#5b8db5" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="400" y="148" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">DOCUMENTED</text>

  <!-- Tier 3: INFERRED -->
  <polygon points="308,168 492,168 520,212 280,212" fill="#d4a574" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="400" y="194" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">INFERRED / THEORY</text>

  <!-- Tier 4: FOLKLORE -->
  <polygon points="280,216 520,216 552,262 248,262" fill="#c97a5a" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="400" y="243" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">FOLKLORE</text>

  <!-- Tier 5: SPECULATION (base) -->
  <polygon points="248,266 552,266 592,315 208,315" fill="#888" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="400" y="294" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">SPECULATION / RUMOUR</text>

  <!-- Right column: examples -->
  <line x1="468" y1="98" x2="608" y2="98" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="613" y="94" font-size="8" font-weight="bold" fill="#2c5a2c">VERIFIED</text>
  <text x="613" y="106" font-size="8" fill="#1a1a1a">• Palace exists; 5 storeys (4 submerged)</text>
  <text x="613" y="117" font-size="8" fill="#1a1a1a">• Man Sagar Dam built by Jai Singh II (1727)</text>

  <line x1="492" y1="144" x2="608" y2="144" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="613" y="140" font-size="8" font-weight="bold" fill="#5b8db5">DOCUMENTED</text>
  <text x="613" y="152" font-size="8" fill="#1a1a1a">• Used as royal duck-hunting lodge</text>
  <text x="613" y="163" font-size="8" fill="#1a1a1a">• Restoration begun 2005 (JDA records)</text>

  <line x1="520" y1="190" x2="608" y2="190" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="613" y="186" font-size="8" font-weight="bold" fill="#8a6532">INFERRED</text>
  <text x="613" y="198" font-size="8" fill="#1a1a1a">• Submerged floors contain arched</text>
  <text x="613" y="210" font-size="8" fill="#1a1a1a">  rooms (based on architectural survey)</text>

  <line x1="552" y1="240" x2="608" y2="240" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="613" y="236" font-size="8" font-weight="bold" fill="#8b3a1a">FOLKLORE</text>
  <text x="613" y="248" font-size="8" fill="#1a1a1a">• Bodies of royal enemies thrown in lake</text>
  <text x="613" y="260" font-size="8" fill="#1a1a1a">• Lights move behind palace windows at night</text>

  <line x1="590" y1="290" x2="608" y2="290" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="613" y="286" font-size="8" font-weight="bold" fill="#555">SPECULATION</text>
  <text x="613" y="298" font-size="8" fill="#1a1a1a">• Treasure sealed in submerged floors</text>
  <text x="613" y="310" font-size="8" fill="#1a1a1a">• Lake is an aquatic gateway / portal</text>

  <!-- Left column: criteria -->
  <line x1="332" y1="98" x2="200" y2="98" stroke="#2c5a2c" stroke-width="0.6"/>
  <text x="198" y="96" font-size="8" text-anchor="end" fill="#2c5a2c">→ multi-source, physical evidence</text>

  <line x1="308" y1="144" x2="200" y2="144" stroke="#5b8db5" stroke-width="0.6"/>
  <text x="198" y="142" font-size="8" text-anchor="end" fill="#5b8db5">→ official / museum records</text>

  <line x1="280" y1="190" x2="200" y2="190" stroke="#8a6532" stroke-width="0.6"/>
  <text x="198" y="188" font-size="8" text-anchor="end" fill="#8a6532">→ architectural inference;</text>
  <text x="198" y="200" font-size="8" text-anchor="end" fill="#8a6532">   submerged floors unexcavated</text>

  <line x1="248" y1="240" x2="200" y2="240" stroke="#8b3a1a" stroke-width="0.6"/>
  <text x="198" y="238" font-size="8" text-anchor="end" fill="#8b3a1a">→ oral tradition only;</text>
  <text x="198" y="250" font-size="8" text-anchor="end" fill="#8b3a1a">   no primary source</text>

  <line x1="210" y1="290" x2="200" y2="290" stroke="#555" stroke-width="0.6"/>
  <text x="198" y="288" font-size="8" text-anchor="end" fill="#555">→ no verifiable source</text>

  <!-- Author note box at bottom -->
  <g transform="translate(50, 332)">
    <rect x="0" y="0" width="700" height="68" fill="#fff" stroke="#3a2a20" stroke-width="1.2"/>
    <text x="350" y="20" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B0000">FOR THE AUTHOR</text>
    <text x="350" y="37" font-size="9" text-anchor="middle" fill="#1a1a1a">
      Jal Mahal's haunting is not famous the way Bhangarh's is. The mystery here is architectural: 4 floors of a royal palace have been under water for ~250 years and no one has fully explored them.
    </text>
    <text x="350" y="54" font-size="9" text-anchor="middle" fill="#1a1a1a">
      The darkness is structural — not folklore. A fiction writer can place anything in those submerged rooms and it will feel plausible.
    </text>
  </g>

  <text x="400" y="490" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Every claim in this dossier is tagged with one of these tiers
  </text>
</svg>
