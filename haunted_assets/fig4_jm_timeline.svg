<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Georgia, serif">
  <rect width="820" height="420" fill="#f9f4ed"/>

  <text x="410" y="28" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 4 — HISTORICAL TIMELINE: JAL MAHAL &amp; MAN SAGAR LAKE</text>
  <text x="410" y="46" font-size="10" font-style="italic" text-anchor="middle" fill="#666">From the founding of Jaipur to present-day restoration</text>

  <!-- Timeline backbone -->
  <line x1="60" y1="230" x2="760" y2="230" stroke="#3a2a20" stroke-width="3"/>
  <!-- Arrow -->
  <polygon points="760,230 750,224 750,236" fill="#3a2a20"/>

  <!-- Era bands (below the line) -->
  <!-- Rajput/Mughal era band -->
  <rect x="60" y="232" width="260" height="18" fill="#c8a878" opacity="0.35"/>
  <text x="190" y="245" font-size="8" text-anchor="middle" fill="#7a5030">KACHWAHA RAJPUT ERA</text>

  <!-- Colonial era band -->
  <rect x="320" y="232" width="260" height="18" fill="#8a9ab8" opacity="0.3"/>
  <text x="450" y="245" font-size="8" text-anchor="middle" fill="#3a5070">COLONIAL PERIOD</text>

  <!-- Post-Independence band -->
  <rect x="580" y="232" width="180" height="18" fill="#7a9a6a" opacity="0.3"/>
  <text x="670" y="245" font-size="8" text-anchor="middle" fill="#3a6030">POST-INDEPENDENCE</text>

  <!-- ── Events ── -->

  <!-- 1. ~1699: Man Sagar Dam origins (Jai Singh I era) -->
  <circle cx="90" cy="230" r="7" fill="#8B0000" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="223" x2="90" y2="175" stroke="#8B0000" stroke-width="1.5"/>
  <text x="90" y="168" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">~1610</text>
  <text x="90" y="155" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Earliest dam</text>
  <text x="90" y="145" font-size="8.5" text-anchor="middle" fill="#1a1a1a">on Dravyavati</text>
  <text x="90" y="132" font-size="7.5" font-style="italic" text-anchor="middle" fill="#8B0000">[INFERRED]</text>

  <!-- 2. 1727: Jai Singh II founds Jaipur + Man Sagar extended -->
  <circle cx="185" cy="230" r="8" fill="#8B0000" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="185" y1="238" x2="185" y2="295" stroke="#8B0000" stroke-width="1.5"/>
  <text x="185" y="308" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">1727</text>
  <text x="185" y="322" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Maharaja Jai Singh II</text>
  <text x="185" y="334" font-size="8.5" text-anchor="middle" fill="#1a1a1a">founds Jaipur; Man</text>
  <text x="185" y="346" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Sagar dam expanded</text>
  <text x="185" y="358" font-size="7.5" font-style="italic" text-anchor="middle" fill="#8B0000">[VERIFIED]</text>

  <!-- 3. ~1750-99: Palace built by Madho Singh I -->
  <circle cx="285" cy="230" r="8" fill="#8B0000" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="285" y1="223" x2="285" y2="148" stroke="#8B0000" stroke-width="1.5"/>
  <text x="285" y="140" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">~1750–99</text>
  <text x="285" y="126" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Jal Mahal built /</text>
  <text x="285" y="114" font-size="8.5" text-anchor="middle" fill="#1a1a1a">extended; 5-storey</text>
  <text x="285" y="102" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Rajput-Mughal palace</text>
  <text x="285" y="88" font-size="7.5" font-style="italic" text-anchor="middle" fill="#8B0000">[DOCUMENTED]</text>

  <!-- 4. ~1803: Further embellishment under Pratap Singh -->
  <circle cx="375" cy="230" r="7" fill="#8B0000" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="375" y1="238" x2="375" y2="295" stroke="#8B0000" stroke-width="1.5"/>
  <text x="375" y="308" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">c.1803</text>
  <text x="375" y="322" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Sawai Pratap Singh</text>
  <text x="375" y="334" font-size="8.5" text-anchor="middle" fill="#1a1a1a">adds embellishments;</text>
  <text x="375" y="346" font-size="8.5" text-anchor="middle" fill="#1a1a1a">used for royal hunts</text>
  <text x="375" y="358" font-size="7.5" font-style="italic" text-anchor="middle" fill="#8B0000">[DOCUMENTED]</text>

  <!-- 5. Early 20th c: Lake pollution -->
  <circle cx="480" cy="230" r="7" fill="#8B0000" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="480" y1="223" x2="480" y2="165" stroke="#8B0000" stroke-width="1.5"/>
  <text x="480" y="157" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">Early 1900s</text>
  <text x="480" y="143" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Lake becomes heavily</text>
  <text x="480" y="131" font-size="8.5" text-anchor="middle" fill="#1a1a1a">polluted; palace falls</text>
  <text x="480" y="119" font-size="8.5" text-anchor="middle" fill="#1a1a1a">into disuse</text>
  <text x="480" y="105" font-size="7.5" font-style="italic" text-anchor="middle" fill="#8B0000">[DOCUMENTED]</text>

  <!-- 6. 1947: Independence -->
  <circle cx="565" cy="230" r="7" fill="#8B0000" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="565" y1="238" x2="565" y2="290" stroke="#8B0000" stroke-width="1.5"/>
  <text x="565" y="303" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">1947</text>
  <text x="565" y="318" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Post-Independence;</text>
  <text x="565" y="330" font-size="8.5" text-anchor="middle" fill="#1a1a1a">palace passes to</text>
  <text x="565" y="342" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Rajasthan Govt.</text>

  <!-- 7. 2005: Restoration -->
  <circle cx="645" cy="230" r="7" fill="#8B0000" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="645" y1="223" x2="645" y2="155" stroke="#8B0000" stroke-width="1.5"/>
  <text x="645" y="147" font-size="10" font-weight="bold" text-anchor="middle" fill="#8B0000">2005</text>
  <text x="645" y="133" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Restoration project</text>
  <text x="645" y="121" font-size="8.5" text-anchor="middle" fill="#1a1a1a">launched by JDA;</text>
  <text x="645" y="109" font-size="8.5" text-anchor="middle" fill="#1a1a1a">lake de-silted</text>
  <text x="645" y="95" font-size="7.5" font-style="italic" text-anchor="middle" fill="#8B0000">[VERIFIED]</text>

  <!-- 8. Present -->
  <circle cx="730" cy="230" r="9" fill="#1a1a1a" stroke="#8B0000" stroke-width="2"/>
  <line x1="730" y1="238" x2="730" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="730" y="308" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">PRESENT</text>
  <text x="730" y="323" font-size="8.5" text-anchor="middle" fill="#1a1a1a">Exterior restored;</text>
  <text x="730" y="335" font-size="8.5" text-anchor="middle" fill="#1a1a1a">interior closed;</text>
  <text x="730" y="347" font-size="8.5" text-anchor="middle" fill="#1a1a1a">view from shore only</text>

  <text x="410" y="408" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Timeline approximate; Jal Mahal's builder debated (Jai Singh II vs. Madho Singh I); see text for nuance
  </text>
</svg>
