<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Georgia, serif">
  <rect width="800" height="540" fill="#f4f0ea"/>

  <text x="400" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">FIG 2 — JAIPUR REGION MAP</text>
  <text x="400" y="50" font-size="10" font-style="italic" text-anchor="middle" fill="#666">Man Sagar Lake · Jal Mahal · Amber Fort · Nahargarh Fort — spatial relationships</text>

  <!-- Map base area -->
  <rect x="40" y="68" width="720" height="420" fill="#ddd5bc" stroke="#5a4030" stroke-width="1.5" rx="2"/>

  <!-- Aravalli Hills range (runs NE-SW) — shaded terrain -->
  <path d="M 40,200 Q 120,165 200,155 Q 280,148 340,155 Q 380,160 410,172 Q 440,185 460,198 Q 490,215 510,225 Q 545,238 580,242 Q 620,248 660,252 Q 700,256 760,255 L 760,488 L 40,488 Z"
        fill="#c8b898" opacity="0.55"/>
  <text x="550" y="195" font-size="10" font-style="italic" fill="#7a6040" font-weight="bold">Aravalli Hills</text>

  <!-- Man Sagar Lake — the centrepiece -->
  <ellipse cx="400" cy="265" rx="90" ry="48" fill="#5b8db5" opacity="0.88"/>
  <ellipse cx="400" cy="265" rx="90" ry="48" fill="none" stroke="#2a5a7a" stroke-width="1.8"/>
  <text x="400" y="255" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">MAN SAGAR</text>
  <text x="400" y="268" font-size="9" font-style="italic" text-anchor="middle" fill="#d8eaf8">LAKE</text>

  <!-- Jal Mahal (palace in lake centre) -->
  <g transform="translate(400, 265)">
    <polygon points="0,-12 4,-4 12,-4 5,2 8,11 0,6 -8,11 -5,2 -12,-4 -4,-4"
             fill="#8B0000" stroke="#fff" stroke-width="1.2"/>
    <text x="0" y="26" font-size="9" font-weight="bold" text-anchor="middle" fill="#8B0000">JAL MAHAL</text>
  </g>

  <!-- Dravyavati River — feeds the lake -->
  <path d="M 40,180 Q 120,190 200,200 Q 280,210 340,240 Q 365,252 385,262"
        fill="none" stroke="#5b8db5" stroke-width="5" opacity="0.65"/>
  <text x="160" y="200" font-size="9" font-style="italic" fill="#2a5a7a">Dravyavati</text>
  <text x="160" y="212" font-size="9" font-style="italic" fill="#2a5a7a">River</text>

  <!-- Lake outflow (eastern side) -->
  <path d="M 490,265 Q 540,268 580,275 Q 620,282 660,290 Q 710,300 760,305"
        fill="none" stroke="#5b8db5" stroke-width="3" opacity="0.5"/>

  <!-- Dam / Bund (western end of lake) -->
  <rect x="305" y="255" width="8" height="22" fill="#5a3a20" stroke="#3a2010" stroke-width="1.2"/>
  <text x="298" y="278" font-size="8" text-anchor="end" fill="#5a3a20" font-weight="bold">Bund</text>
  <text x="298" y="288" font-size="8" text-anchor="end" fill="#5a3a20">(dam)</text>

  <!-- NH-52 (Delhi–Jaipur highway — runs along south shore of lake) -->
  <path d="M 40,320 Q 150,318 280,315 Q 360,313 430,313 Q 520,313 600,315 Q 680,318 760,322"
        fill="none" stroke="#e8a820" stroke-width="3.5"/>
  <text x="100" y="310" font-size="9" font-weight="bold" fill="#8a6010">NH-52</text>
  <text x="100" y="321" font-size="8" fill="#8a6010">Delhi ← → Jaipur</text>

  <!-- Jaipur City (south of lake) -->
  <ellipse cx="380" cy="395" rx="55" ry="38" fill="#d4a878" opacity="0.55" stroke="#8B0000" stroke-width="1.2"/>
  <text x="380" y="392" font-size="13" font-weight="bold" text-anchor="middle" fill="#8B0000">JAIPUR</text>
  <text x="380" y="407" font-size="8" text-anchor="middle" fill="#5a2020">Pink City</text>

  <!-- Amber Fort (northeast of lake, in hills) -->
  <g transform="translate(530, 185)">
    <rect x="-20" y="-15" width="40" height="30" fill="#c8a060" stroke="#8a6030" stroke-width="1.5"/>
    <polygon points="0,-22 5,-15 -5,-15" fill="#c8a060" stroke="#8a6030" stroke-width="1"/>
    <text x="0" y="4" font-size="8" font-weight="bold" text-anchor="middle" fill="#3a2010">AMBER</text>
    <text x="0" y="25" font-size="8" font-style="italic" text-anchor="middle" fill="#3a2010">Fort</text>
  </g>

  <!-- Nahargarh Fort (northwest, on hilltop) -->
  <g transform="translate(245, 160)">
    <rect x="-18" y="-13" width="36" height="26" fill="#c8a060" stroke="#8a6030" stroke-width="1.5"/>
    <polygon points="0,-18 4,-13 -4,-13" fill="#c8a060" stroke="#8a6030" stroke-width="1"/>
    <text x="0" y="2" font-size="8" font-weight="bold" text-anchor="middle" fill="#3a2010">NAHARGARH</text>
    <text x="0" y="23" font-size="8" font-style="italic" text-anchor="middle" fill="#3a2010">Fort</text>
  </g>

  <!-- Jaigarh Fort (above Amber, further NE) -->
  <g transform="translate(590, 155)">
    <rect x="-15" y="-10" width="30" height="20" fill="#b89050" stroke="#8a6030" stroke-width="1"/>
    <text x="0" y="2" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#3a2010">JAIGARH</text>
    <text x="0" y="22" font-size="7" font-style="italic" text-anchor="middle" fill="#3a2010">Fort</text>
  </g>

  <!-- Hawa Mahal (in Jaipur city) -->
  <circle cx="400" cy="380" r="4" fill="#c8956a" stroke="#8a5030" stroke-width="0.8"/>
  <text x="408" y="380" font-size="7.5" fill="#5a3020">Hawa Mahal</text>

  <!-- City Palace (in Jaipur city) -->
  <circle cx="370" cy="390" r="4" fill="#c8956a" stroke="#8a5030" stroke-width="0.8"/>
  <text x="358" y="390" font-size="7.5" text-anchor="end" fill="#5a3020">City Palace</text>

  <!-- Jantar Mantar -->
  <circle cx="388" cy="405" r="3" fill="#c8956a" stroke="#8a5030" stroke-width="0.8"/>
  <text x="396" y="405" font-size="7" fill="#5a3020">Jantar Mantar</text>

  <!-- Distances annotation lines -->
  <!-- Jaipur city to Jal Mahal: 10 km -->
  <line x1="398" y1="355" x2="400" y2="313" stroke="#8B0000" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="410" y="340" font-size="8.5" fill="#8B0000" font-style="italic">10 km</text>

  <!-- Amber to Jal Mahal: ~6 km -->
  <line x1="510" y1="192" x2="490" y2="260" stroke="#8B0000" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="502" y="230" font-size="8.5" fill="#8B0000" font-style="italic">~6 km</text>

  <!-- Compass -->
  <g transform="translate(72, 100)">
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#5a4030" stroke-width="1.5"/>
    <polygon points="0,-14 4,0 0,14 -4,0" fill="#8B0000"/>
    <text x="0" y="-26" font-size="11" font-weight="bold" text-anchor="middle" fill="#3a2a20">N</text>
  </g>

  <!-- Legend box -->
  <g transform="translate(550, 395)">
    <rect x="0" y="0" width="198" height="82" fill="#fff" stroke="#5a4030" stroke-width="1"/>
    <text x="99" y="15" font-size="9" font-weight="bold" text-anchor="middle" fill="#8B0000">LEGEND</text>
    <!-- Site star -->
    <polygon points="12,30 14,25 20,25 15,28 17,34 12,31 7,34 9,28 4,25 10,25" fill="#8B0000" stroke="#1a1a1a" stroke-width="0.7"/>
    <text x="28" y="33" font-size="8" fill="#1a1a1a">Primary site</text>
    <!-- Fort box -->
    <rect x="4" y="42" width="16" height="12" fill="#c8a060" stroke="#8a6030" stroke-width="1"/>
    <text x="28" y="52" font-size="8" fill="#1a1a1a">Historic fort</text>
    <!-- Lake fill -->
    <ellipse cx="12" cy="65" rx="12" ry="6" fill="#5b8db5" opacity="0.8"/>
    <text x="28" y="68" font-size="8" fill="#1a1a1a">Lake / river</text>
  </g>

  <text x="400" y="510" font-size="8" font-style="italic" text-anchor="middle" fill="#888">
    Stylized schematic map — positions approximate; not to surveyed scale
  </text>
</svg>
